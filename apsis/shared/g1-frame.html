<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="asset" content="{{ASSET}} {{VERSION}}">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
{{CSS}}
</style>
</head>
<body>
<div id="app">

  <section class="screen on" id="start">
    <div class="panel-wrap">
      <div class="panel">
        <div class="mascot" id="start-mascot"></div>
        <div class="kicker" id="start-kicker"></div>
        <h1 id="start-title"></h1>
        <p class="sub" id="start-sub"></p>
        <button class="big-btn" id="play-btn" type="button">&#9654; Play</button>
      </div>
    </div>
  </section>

  <section class="screen" id="game">
    <div class="topbar">
      <button class="icon-btn" id="pause-btn" type="button" aria-label="Pause"></button>
      <div class="progress" id="progress"></div>
      <div class="star-count" aria-label="Stars"><span id="star-icon"></span><span id="star-num">0</span></div>
    </div>
    <div class="stage" id="stage"></div>
    <div class="banner" id="banner"></div>
  </section>

  <section class="screen" id="end">
    <div class="panel-wrap">
      <div class="panel">
        <div class="mascot" id="end-mascot"></div>
        <h1>Well done!</h1>
        <div class="end-stars" id="end-stars"></div>
        <div class="btn-row">
          <button class="big-btn alt" id="again-btn" type="button">&#8635; Again</button>
          <button class="big-btn" id="next-btn" type="button">Next &#9654;</button>
        </div>
      </div>
    </div>
  </section>

</div>

<div class="overlay" id="pause">
  <div class="panel">
    <h1>Paused</h1>
    <div class="menu">
      <button class="big-btn" id="resume-btn" type="button">&#9654; Resume</button>
      <button class="big-btn alt" id="sound-btn" type="button">Sound: on</button>
      <button class="big-btn alt" id="restart-btn" type="button">&#8635; Restart</button>
      <button class="big-btn alt" id="exit-btn" type="button">Exit</button>
    </div>
  </div>
</div>

<div class="praise" id="praise"></div>
<canvas id="confetti"></canvas>
<div class="hand" id="hand"></div>

<script>
{{JS}}
</script>
</body>
</html>
