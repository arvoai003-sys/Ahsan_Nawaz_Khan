<style>
/* ARVO Grade 1 shell: bright nursery theme shared by every APSIS G1 asset. */
:root {
  --ink: #2E2A4F;
  --ink-soft: #5B5680;
  --sky-top: #6CCBFF;
  --sky-bottom: #CFF0FF;
  --yellow: #FFD23F; --yellow-d: #E0A800;
  --red: #FF4F6D;    --red-d: #D6204A;
  --blue: #2EA7FF;   --blue-d: #0B7FD6;
  --green: #23C16B;  --green-d: #139650;
  --orange: #FF9F1C; --orange-d: #E07B00;
  --purple: #9B5DE5; --purple-d: #7A3CC8;
  --pink: #FF7BAC;
  --right: #23C16B;
  --card: #FFFFFF;
  --radius: 26px;
  --font-title: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-read: "Andika", "Century Gothic", "Segoe UI", system-ui, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--sky-bottom);
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 70%);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; }

/* scenery: clouds and hills, behind everything */
#scenery { position: fixed; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; z-index: 0; }
#scenery svg { position: absolute; }
#scenery .hills { left: 0; bottom: 0; width: 100%; height: 22%; min-height: 90px; }
#scenery .cloud { width: 150px; height: 70px; opacity: .95; animation: drift 40s linear infinite; }
#scenery .c1 { top: 12%; left: -10%; }
#scenery .c2 { top: 30%; left: 70%; width: 110px; animation-duration: 55s; animation-delay: -20s; }
#scenery .c3 { top: 6%; left: 40%; width: 90px; animation-duration: 65s; animation-delay: -35s; }
@keyframes drift { 0% { transform: translateX(-20vw); } 100% { transform: translateX(120vw); } }

#app { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; z-index: 1; }

/* ---------- screens ---------- */
.screen { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: none; flex-direction: column; }
.screen.on { display: flex; }

/* ---------- chunky candy buttons ---------- */
.big-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-width: 150px; min-height: 72px; padding: 0 26px; border: 4px solid var(--ink); border-radius: 40px;
  background: var(--yellow); color: var(--ink); font-family: var(--font-title);
  font-weight: 800; font-size: 26px; cursor: pointer; white-space: nowrap;
  box-shadow: 0 7px 0 var(--ink); transition: transform .08s, box-shadow .08s;
}
.big-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
.big-btn.green { background: var(--green); color: #fff; }
.big-btn.blue { background: var(--blue); color: #fff; }
.big-btn.pink { background: var(--pink); color: #fff; }
.big-btn .ic { width: 30px; height: 30px; display: inline-block; }
.big-btn .ic svg { width: 100%; height: 100%; }
.btn-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }

.icon-btn {
  width: 62px; height: 62px; border-radius: 50%; border: 4px solid var(--ink); background: var(--card);
  box-shadow: 0 5px 0 var(--ink); display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex: 0 0 auto; padding: 0;
}
.icon-btn svg { width: 30px; height: 30px; }
.icon-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.icon-btn.talk { background: var(--blue); color: #fff; }
.icon-btn.talk svg { fill: #fff; }
.icon-btn.home { background: var(--green); }
.icon-btn.home svg { width: 36px; height: 36px; }
.icon-btn.pause { background: var(--yellow); }

/* ---------- home: level picker ---------- */
.home-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 14px 16px 18px; min-height: 0; overflow-y: auto; }
.home-head { display: flex; align-items: center; gap: 12px; margin: 4px 0 12px; }
.home-head .mascot { width: 96px; height: 96px; flex: 0 0 auto; animation: bob 2.4s ease-in-out infinite; }
.home-head .mascot svg { width: 100%; height: 100%; }
.home-title .kicker {
  font-weight: 800; letter-spacing: .08em; font-size: 14px; color: #fff;
  background: var(--purple); border-radius: 20px; padding: 2px 12px; display: inline-block;
  border: 3px solid var(--ink);
}
.home-title h1 {
  font-family: var(--font-title); font-weight: 800; font-size: 40px; line-height: 1; margin: 6px 0 0;
  color: #fff; -webkit-text-stroke: 2px var(--ink); text-shadow: 0 4px 0 var(--ink);
}
.home-head .icon-btn { margin-left: 4px; }
.choose { font-family: var(--font-title); font-weight: 800; font-size: 24px; color: var(--ink); margin: 0 0 10px; }

.levels { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; max-width: 760px; }
.level {
  position: relative; width: 210px; min-height: 170px; border-radius: 28px; border: 4px solid var(--ink);
  background: var(--yellow); box-shadow: 0 8px 0 var(--ink); cursor: pointer; padding: 12px 10px 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  transition: transform .1s, box-shadow .1s; outline: none;
}
.level:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--ink); }
.level:focus-visible { outline: 5px solid #fff; }
.level .num {
  position: absolute; top: -14px; left: -10px; width: 46px; height: 46px; border-radius: 50%;
  background: #fff; border: 4px solid var(--ink); font-family: var(--font-title); font-weight: 800;
  font-size: 26px; line-height: 38px; text-align: center;
}
.level .art { width: 80px; height: 80px; background: #fff; border-radius: 50%; border: 4px solid var(--ink); padding: 8px; }
.level .art svg { width: 100%; height: 100%; }
.level .name { font-family: var(--font-title); font-weight: 800; font-size: 24px; color: #fff; -webkit-text-stroke: 1px var(--ink); text-shadow: 0 3px 0 var(--ink); line-height: 1.1; text-align: center; margin-top: 4px; }
.level .lstars { display: flex; gap: 2px; margin-top: 4px; }
.level .lstars svg { width: 26px; height: 26px; }
.level .ribbon {
  position: absolute; top: -12px; right: -8px; background: #fff; border: 3px solid var(--ink); border-radius: 12px;
  font-weight: 800; font-size: 14px; padding: 0 8px; transform: rotate(6deg);
}
.level.c0 { background: var(--yellow); } .level.c1 { background: var(--red); } .level.c2 { background: var(--blue); }
.level.c3 { background: var(--green); } .level.c4 { background: var(--orange); } .level.c5 { background: var(--purple); }

/* ---------- panels (end, pause) ---------- */
.panel-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; }
.panel {
  background: var(--card); border-radius: 34px; border: 5px solid var(--ink); box-shadow: 0 10px 0 var(--ink);
  padding: 22px 22px 26px; width: 92vw; max-width: 500px; text-align: center; position: relative;
}
.panel h1 {
  font-family: var(--font-title); font-weight: 800; font-size: 46px; line-height: 1; margin: 4px 0 6px;
  color: var(--orange); -webkit-text-stroke: 2px var(--ink); text-shadow: 0 4px 0 var(--ink);
}
.panel .mascot { width: 110px; height: 110px; margin: -70px auto 0; display: block; animation: bob 2.4s ease-in-out infinite; }
.panel .mascot svg { width: 100%; height: 100%; }
.panel .sub { font-size: 20px; font-weight: 700; color: var(--ink-soft); margin: 2px 0 8px; }

/* ---------- top bar ---------- */
.topbar { flex: 0 0 auto; height: 80px; display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
.progress { flex: 1; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.progress i {
  width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid var(--ink);
  display: block; opacity: .75;
}
.progress i.done { background: var(--green); opacity: 1; }
.progress i.now { background: var(--yellow); opacity: 1; transform: scale(1.25); }
.star-count {
  display: flex; align-items: center; gap: 4px; font-family: var(--font-title);
  font-weight: 800; font-size: 26px; background: var(--card); border-radius: 30px; border: 4px solid var(--ink);
  padding: 2px 14px 2px 6px; box-shadow: 0 5px 0 var(--ink);

.star-count svg { width: 32px; height: 32px; }
.level-tag {

  border: 3px solid var(--ink); border-radius: 18px; padding: 2px 10px; white-space: nowrap;
}

/* ---------- stage ---------- */
.stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 4px 16px 24px; gap: 18px; min-height: 0; }
.prompt {
  display: flex; align-items: center; gap: 12px; background: var(--card);
  border-radius: 30px; border: 4px solid var(--ink); padding: 8px 18px 8px 8px; box-shadow: 0 6px 0 var(--ink);

}
.prompt .say { width: 58px; height: 58px; flex: 0 0 auto; }
.prompt-text { font-family: var(--font-read); font-weight: 700; font-size: 26px; font-size: clamp(20px, 5vw, 26px); line-height: 1.25; }
.prompt-text b { color: var(--red); }
.counter { display: flex; gap: 6px; margin-left: 4px; }
.counter b { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--ink); background: #fff; display: block; }
.counter b.got { background: var(--green); }

/* round banner */
.banner {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: none; align-items: center; justify-content: center;
  z-index: 30;
}
.banner.on { display: flex; }
.banner div {
  font-family: var(--font-title); font-weight: 800; font-size: 56px; font-size: clamp(36px, 10vw, 60px);
  color: #fff; -webkit-text-stroke: 2px var(--ink); text-shadow: 0 5px 0 var(--ink);
  background: var(--pink); border: 5px solid var(--ink); border-radius: 34px; padding: 10px 34px;
  box-shadow: 0 10px 0 var(--ink); animation: pop .5s cubic-bezier(.2,1.6,.4,1); text-align: center;
}

/* ---------- pause overlay ---------- */
.overlay {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(46,42,79,.5); display: none;
  align-items: center; justify-content: center; z-index: 50; padding: 16px;
}
.overlay.on { display: flex; }
.menu { display: flex; flex-direction: column; gap: 16px; margin-top: 10px; }
.menu .big-btn { width: 100%; }

/* ---------- feedback ---------- */
.shake { animation: shake .45s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-12px) rotate(-3deg)} 40%{transform:translateX(10px) rotate(2deg)} 60%{transform:translateX(-7px)} 80%{transform:translateX(5px)} }
@keyframes pop { 0%{transform:scale(.3);opacity:0} 100%{transform:scale(1);opacity:1} }
@keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
@keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-6deg)} 75%{transform:rotate(6deg)} }

.praise {
  position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%);
  font-family: var(--font-title); font-weight: 800; font-size: 72px; font-size: clamp(44px, 13vw, 80px);
  color: var(--yellow); -webkit-text-stroke: 3px var(--ink); text-shadow: 0 6px 0 var(--ink);
  pointer-events: none; z-index: 40; display: none; white-space: nowrap;
}
.praise.on { display: block; animation: pop .45s cubic-bezier(.2,1.6,.4,1); }

#confetti { position: fixed; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; z-index: 45; }

/* tutorial hand */
.hand {
  position: fixed; width: 76px; height: 76px; z-index: 60; pointer-events: none;
  display: none; transition: left .9s ease-in-out, top .9s ease-in-out;
  filter: drop-shadow(0 4px 4px rgba(0,0,0,.25));
}
.hand.on { display: block; }
.hand.tap { animation: tap .5s ease-in-out 2; }
@keyframes tap { 0%,100%{transform:scale(1)} 50%{transform:scale(.82)} }

/* end stars */
.end-stars { display: flex; justify-content: center; gap: 6px; margin: 6px 0 8px; }
.end-stars svg { width: 76px; height: 76px; }
.end-stars svg.lit { animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }
.end-stars svg:nth-child(2) { animation-delay: .25s; margin-top: -16px; }
.end-stars svg:nth-child(3) { animation-delay: .5s; }

@media (max-width: 520px) {

  .level .name { font-size: 19px; }
  .level .lstars svg { width: 20px; height: 20px; }
  .topbar { gap: 8px; padding: 8px; }
  .icon-btn { width: 54px; height: 54px; }
  .level-tag { display: none; }
  .progress { gap: 4px; }
  .progress i { width: 13px; height: 13px; border-width: 2.5px; }

}
@media (max-height: 520px) {
  .topbar { height: 66px; }
  .icon-btn { width: 52px; height: 52px; }
  .stage { gap: 10px; padding-bottom: 10px; }
  .home-wrap { padding-top: 6px; }
  .home-head { margin: 0 0 6px; }
  .home-head .mascot { width: 60px; height: 60px; }
  .home-title h1 { font-size: 30px; }
  .choose { display: none; }
  .levels { max-width: none; flex-wrap: nowrap; gap: 10px; }
  .level { width: 112px; min-height: 150px; padding: 10px 4px 6px; }
  .level .art { width: 58px; height: 58px; padding: 5px; }
  .level .name { font-size: 17px; }
  .level .lstars svg { width: 18px; height: 18px; }
  .panel { padding: 12px 16px 16px; }
  .panel .mascot { width: 70px; height: 70px; margin-top: -44px; }
  .panel h1 { font-size: 34px; }

  .end-stars { margin: 2px 0 4px; }
  .panel .sub { margin: 0 0 2px; font-size: 17px; }
  .btn-row { flex-wrap: nowrap; gap: 10px; margin-top: 4px; }
  .btn-row .big-btn { min-width: 0; min-height: 60px; padding: 0 16px; font-size: 21px; }
  .menu { gap: 10px; }
  .menu .big-btn { min-height: 54px; font-size: 21px; }
  #scenery .hills { height: 16%; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* Tap-to-identify board */
.board { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; max-width: 760px; }
.target-row { display: flex; align-items: center; gap: 14px; }
.cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; width: 100%; }
.cards.six { max-width: 560px; }

.card {
  position: relative; width: 150px; min-height: 176px; background: var(--card); border-radius: var(--radius);
  border: 4px solid var(--ink); box-shadow: 0 8px 0 var(--ink); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  padding: 12px 10px 10px; transition: transform .12s, box-shadow .12s; outline: none;
  animation: pop .35s cubic-bezier(.2,1.6,.4,1) both;
}
.cards .card:nth-child(2) { animation-delay: .06s; } .cards .card:nth-child(3) { animation-delay: .12s; }
.cards .card:nth-child(4) { animation-delay: .18s; } .cards .card:nth-child(5) { animation-delay: .24s; }
.cards .card:nth-child(6) { animation-delay: .3s; }
.card:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--ink); }
.card:focus-visible { outline: 5px solid var(--yellow); }
.card .art {
  width: 100px; height: 100px; margin-bottom: 6px; border-radius: 50%; padding: 8px;
  background: #FFF4C2; border: 3px solid var(--ink);
}
.card.k0 .art { background: #FFF1B8; } .card.k1 .art { background: #FFD6DE; } .card.k2 .art { background: #CDEBFF; }
.card.k3 .art { background: #CFF5DE; } .card.k4 .art { background: #FFE2C2; } .card.k5 .art { background: #E6D6FA; }
.card.k0 { border-bottom-color: var(--yellow-d); } .card.k1 { border-bottom-color: var(--red-d); } .card.k2 { border-bottom-color: var(--blue-d); }
.card .art svg { width: 100%; height: 100%; }
.card .word { font-family: var(--font-read); font-weight: 700; font-size: 32px; line-height: 1.1; color: var(--ink); white-space: nowrap; }
.card .word .first { transition: color .2s, background .2s; border-radius: 6px; padding: 0 1px; color: var(--red); }
.card .word .first.mark { background: #FFF1B8; box-shadow: inset 0 -5px 0 var(--yellow); }
.card .badge { position: absolute; top: -14px; right: -14px; width: 52px; height: 52px; box-shadow: 0 4px 0 var(--ink); }
.card .badge svg { width: 26px; height: 26px; }
.card.got { border-color: var(--green); box-shadow: 0 8px 0 var(--green-d), 0 0 0 6px #B8F0CE; cursor: default; animation: wiggle .5s; }
.card.got::after {

  border: 4px solid var(--ink);

  animation: pop .35s cubic-bezier(.2,1.6,.4,1);
}
.card.dim { opacity: .55; }
.card.pulse { animation: glowpulse .8s ease-in-out 1; }
@keyframes glowpulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); box-shadow: 0 8px 0 var(--ink), 0 0 0 8px var(--yellow); } }

/* ---- tap-identify.js ---- */
/* Tap-to-identify engine. The child hears a prompt and taps one or more
   cards. Content shape:
   { rounds: [ { banner, bannerSay, markFirst, items: [
       { say, text, target: {text, art}, options: [{text, art}], answer: ["..."], hint2 } ] } ] }
   ES5 only. Needs Shell and Art. */
var TapIdentify = (function () {
  var T = {};
  var C, flat, idx, item, got, attempts, locked, firstTry, starTotal, tutorialDone;

  function wordHtml(text, markFirst) {
    if (!markFirst) { return text; }
    return '<span class="first">' + text.charAt(0) + "</span>" + text.slice(1);
  }

  function makeCard(opt, markFirst, isTarget) {
    var card = Shell.el("div", "card" + (isTarget ? " target" : ""));
    card.setAttribute("role", isTarget ? "img" : "button");
    card.setAttribute("aria-label", opt.text);
    if (!isTarget) { card.setAttribute("tabindex", "0"); }
    card.innerHTML = '<div class="art">' + Art.get(opt.art) + '</div><div class="word' + (opt.text.length >= 7 ? " long" : "") + '">' + wordHtml(opt.text, markFirst) + "</div>";
    var badge = Shell.speakerBtn("badge", "Listen to " + opt.text);
    badge.onclick = function (e) {
      e.stopPropagation();
      Shell.say(opt.say || opt.text);
    };
    card.appendChild(badge);
    card.optText = opt.text;
    return card;
  }

  function instruction() { return item.say || item.text; }
  /* locked: taps are ignored (speech or tutorial running). data-ready mirrors it for tests. */
  function lock(v) {
    locked = v;
    var st = Shell.$("stage");
    if (st) { st.setAttribute("data-ready", v ? "0" : "1"); }
  }

  function render() {
    var st = Shell.$("stage"), i, round = item.round;
    st.innerHTML = "";
    got = {}; attempts = 0; lock(true); firstTry = true;

    var prompt = Shell.el("div", "prompt");
    var sayBtn = Shell.speakerBtn("say", "Hear the question again");
    sayBtn.onclick = function () { Shell.say(instruction()); };
    prompt.appendChild(sayBtn);
    prompt.appendChild(Shell.el("div", "prompt-text", item.text));
    if (item.answer.length > 1) {
      var ctr = Shell.el("div", "counter"), h = "";
      for (i = 0; i < item.answer.length; i++) { h += "<b></b>"; }
      ctr.innerHTML = h; ctr.id = "counter";
      prompt.appendChild(ctr);
    }
    st.appendChild(prompt);

    var board = Shell.el("div", "board");
    if (item.target) {
      var tr = Shell.el("div", "target-row");
      tr.appendChild(makeCard(item.target, round.markFirst, true));
      board.appendChild(tr);
    }
    var opts = Shell.shuffle(item.options);
    var cards = Shell.el("div", "cards" + (opts.length > 3 ? " six" : ""));
    var tint = Math.floor(Math.random() * 6);
    for (i = 0; i < opts.length; i++) {
      (function (card) {
        card.className += " k" + ((tint + i) % 6);
        card.onclick = function () { tap(card); };
        card.onkeydown = function (e) { if (e.keyCode === 13 || e.keyCode === 32) { e.preventDefault(); tap(card); } };
        cards.appendChild(card);
      })(makeCard(opts[i], round.markFirst, false));
    }
    board.appendChild(cards);
    st.appendChild(board);
    fitWords(st);
    Shell.progress(flat.length, idx);

    var go = Shell.guard(function () {
      if (!tutorialDone && T.tutorial !== false) {
        tutorialDone = true;
        var badge = cards.querySelector(".badge");
        Shell.say(instruction(), Shell.guard(function () {
          Shell.tutorial([
            { node: sayBtn, say: "Tap here to hear the question again." },
            { node: badge, say: "Tap a speaker to hear a word. Then tap the word you choose." }
          ], Shell.guard(function () { lock(false); }));
        }));
      } else {
        lock(false);
        Shell.say(instruction());
      }
    });
    go();
  }

  /* shrink any word that is wider than its card until it fits */
  function fitWords(root) {
    var words = root.querySelectorAll(".card .word"), i, w, size, room;
    for (i = 0; i < words.length; i++) {
      w = words[i];
      w.style.fontSize = "";
      room = w.parentNode.clientWidth - 12;
      size = parseFloat(window.getComputedStyle(w).fontSize);
      while (w.scrollWidth > room && size > 14) {
        size -= 1;
        w.style.fontSize = size + "px";
      }
    }
  }
  T.refit = function () { var st = Shell.$("stage"); if (st) { fitWords(st); } };

  function allCards() { return Shell.$("stage").querySelectorAll(".cards .card"); }

  function tap(card) {
    if (locked || card.className.indexOf("got") > -1) { return; }
    var ok = false, i;
    for (i = 0; i < item.answer.length; i++) { if (item.answer[i] === card.optText) { ok = true; } }
    if (ok) {
      got[card.optText] = true;
      card.className += " got";
      var n = 0, k;
      for (k in got) { if (got.hasOwnProperty(k)) { n++; } }
      var ctr = Shell.$("counter");
      if (ctr) { ctr.children[n - 1].className = "got"; }
      var praise = Shell.right(card);
      if (n === item.answer.length) {
        lock(true);
        if (firstTry) { T.score++; }
        starTotal++; Shell.setStars(starTotal);
        Shell.say(card.optText + ". " + praise, Shell.guard(function () {
          Shell.wait(Shell.guard(next), 500);
        }));
      } else {
        Shell.say(card.optText + ". " + praise + " Find one more.");
      }
    } else {
      firstTry = false;
      attempts++;
      Shell.wrong(card);
      hint();
    }
  }

  function hint() {
    var cards = allCards(), i;
    if (attempts === 1) {
      Shell.say("Try again. " + instruction());
    } else if (attempts === 2) {
      if (item.target) {
        var t = Shell.$("stage").querySelector(".card.target .first");
        if (t) { Shell.flash(t, "mark", 2600); }
        lock(true);
        Shell.say(item.hint2 || ("Listen. " + item.target.text + ". " + item.target.text + "."),
          Shell.guard(function () { listenAll(cards); }));
      } else {
        listenAll(cards);
      }
    } else {
      /* third and later: mark every first letter the same way (reveals nothing) and model listening */
      for (i = 0; i < cards.length; i++) {
        var f = cards[i].querySelector(".first");
        if (f) { Shell.flash(f, "mark", 4000); }
      }
      listenAll(cards);
    }
  }

  /* speak each option in turn while its card pulses */
  function listenAll(cards) {
    var list = [], i;
    for (i = 0; i < cards.length; i++) { if (cards[i].className.indexOf("got") < 0) { list.push(cards[i]); } }
    lock(true);
    var j = 0;
    var step = Shell.guard(function () {
      if (j >= list.length) { lock(false); Shell.say(instruction()); return; }
      var c = list[j]; j++;
      Shell.flash(c, "pulse", 800);
      Shell.say(c.optText, function () { Shell.wait(step, 200); });
    });
    Shell.say("Listen to each word.", step);
  }

  function next() {
    idx++;
    if (idx >= flat.length) {
      Shell.progress(flat.length, flat.length);
      Shell.wait(Shell.guard(function () { Shell.finish(T.score, flat.length); }), 400);
      return;
    }
    item = flat[idx];
    if (item.round !== flat[idx - 1].round && item.round.banner) {
      Shell.$("stage").innerHTML = "";
      Shell.banner(item.round.banner, item.round.bannerSay, Shell.guard(render));
    } else {
      render();
    }
  }

  T.start = function (levelIndex) {
    var r, i, L = C.levels[levelIndex || 0];
    var rounds = L.make ? L.make() : L.rounds;
    flat = [];
    for (r = 0; r < rounds.length; r++) {
      var its = rounds[r].shuffle === false ? rounds[r].items : Shell.shuffle(rounds[r].items);
      for (i = 0; i < its.length; i++) { its[i].round = rounds[r]; flat.push(its[i]); }
    }
    idx = 0; T.score = 0; starTotal = 0;
    item = flat[0];
    if (item.round.banner) {
      Shell.banner(item.round.banner, item.round.bannerSay, Shell.guard(render));
    } else {
      render();
    }
  };
  T.resume = function () { if (item) { Shell.say(instruction()); } };
  T.total = function () { return flat ? flat.length : 0; };
  T.max = function () { return flat ? flat.length : 0; };

  T.init = function (content) {
    C = content;
    window.addEventListener("resize", function () { T.refit(); });
    tutorialDone = false;
    T.score = 0;
  };
  return T;
})();

/* ---- SAMESOUND.game.js ---- */
// @asset ENG01CH02SAMESOUND
// @version v-02
// @title Same First Sound
// @engine tap-identify
/* A6 · Same First Sound · Phonics and Spelling > Sounds at the Start of Word · O4

   Book words (verbatim, p.31 2D A): book stop exit staff hand sign; answer set
   stop, staff, sign. Level 2 and the first item of Level 6 use only these.

   Beyond the book (authored, needs Champ's approval): a Grade 1 word bank on
   the chapter's topics (signs and school, the body and senses, home, food and
   animals a Pakistani child knows). Every bank word starts with a sound that
   matches its first letter, so no letter-sound trap (no "eyes", "ear", "knee",
   "phone"). Only whole words are spoken: TTS cannot say a single sound. */
(function () {
  /* sound -> words. Book words are included so they come back in new company. */
  var BANK = {
    s: ["sun", "sock", "soap", "stop", "sign"],
    b: ["book", "bus", "ball", "bag", "bell", "banana"],
    h: ["hand", "hat", "house", "hen"],
    e: ["exit", "egg", "elephant"],
    m: ["mouth", "moon", "milk", "mango"],
    f: ["face", "foot", "fish", "fan"],
    t: ["tap", "tree", "teeth", "toys"],
    n: ["nose", "nest", "nine"],
    d: ["door", "duck", "drum"],
    l: ["leg", "leaf", "lion", "lollipop"]
  };
  var SOUNDS = [];
  var k;
  for (k in BANK) { if (BANK.hasOwnProperty(k)) { SOUNDS.push(k); } }

  function W(text) { return { text: text, art: text }; }
  function pick(list, n, avoid) {
    var out = [], pool = Shell.shuffle(list), i;
    for (i = 0; i < pool.length && out.length < n; i++) {
      if (!avoid || !avoid[pool[i]]) { out.push(pool[i]); }
    }
    return out;
  }
  /* sounds for one level, spread so the same sound is not used back to back */
  function soundQueue(n, minWords) {
    var ok = [], i, q = [];
    for (i = 0; i < SOUNDS.length; i++) { if (BANK[SOUNDS[i]].length >= minWords) { ok.push(SOUNDS[i]); } }
    while (q.length < n) { q = q.concat(Shell.shuffle(ok)); }
    return q.slice(0, n);
  }
  function otherSounds(not, n) {
    var list = [], i;
    for (i = 0; i < SOUNDS.length; i++) { if (SOUNDS[i] !== not) { list.push(SOUNDS[i]); } }
    return pick(list, n);
  }
  function oneWord(sound, used) {
    var w = pick(BANK[sound], 1, used)[0] || pick(BANK[sound], 1)[0];
    used[w] = true;
    return w;
  }

  /* ---------- item makers ---------- */
  function startsLike(sound, choices, used) {
    var pair = pick(BANK[sound], 2, used);
    if (pair.length < 2) { pair = pick(BANK[sound], 2); }
    used[pair[0]] = true; used[pair[1]] = true;
    var opts = [W(pair[1])], others = otherSounds(sound, choices - 1), i;
    for (i = 0; i < others.length; i++) { opts.push(W(oneWord(others[i], used))); }
    return {
      text: "Which word starts like <b>" + pair[0] + "</b>?",
      say: "Which word starts with the same sound as " + pair[0] + "?",
      target: W(pair[0]), options: opts, answer: [pair[1]],
      hint2: "Listen. " + pair[0] + ". " + pair[0] + "."
    };
  }
  function findTwo(sound, used) {
    var pair = pick(BANK[sound], 2, used);
    if (pair.length < 2) { pair = pick(BANK[sound], 2); }
    used[pair[0]] = true; used[pair[1]] = true;
    var odd = oneWord(otherSounds(sound, 1)[0], used);
    return {
      text: "Two words start the same. Tap them both.",
      say: "Two words start with the same sound. Tap them both.",
      options: [W(pair[0]), W(pair[1]), W(odd)], answer: pair
    };
  }
  function oddOneOut(sound, used) {
    var pair = pick(BANK[sound], 2, used);
    if (pair.length < 2) { pair = pick(BANK[sound], 2); }
    used[pair[0]] = true; used[pair[1]] = true;
    var odd = oneWord(otherSounds(sound, 1)[0], used);
    return {
      text: "Which word starts with a <b>different</b> sound?",
      say: "Two words start the same. One word is different. Which word starts with a different sound?",
      options: [W(pair[0]), W(pair[1]), W(odd)], answer: [odd]
    };
  }
  function findThree(sound, used) {
    var three = pick(BANK[sound], 3, used);
    if (three.length < 3) { three = pick(BANK[sound], 3); }
    var others = otherSounds(sound, 3), opts = [], i;
    for (i = 0; i < 3; i++) { used[three[i]] = true; opts.push(W(three[i])); }
    for (i = 0; i < others.length; i++) { opts.push(W(oneWord(others[i], used))); }
    return {
      text: "Find three words that start with the same sound.",
      say: "Find three words that start with the same sound.",
      options: opts, answer: three
    };
  }
  function many(maker, n, minWords) {
    var q = soundQueue(n, minWords), used = {}, out = [], i;
    for (i = 0; i < n; i++) { out.push(maker(q[i], used)); }
    return out;
  }
  /* starts-like items with a given number of choices (2 or 3) */
  function manyStarts(n, choices) {
    var q = soundQueue(n, 2), used = {}, out = [], i;
    for (i = 0; i < n; i++) { out.push(startsLike(q[i], choices, used)); }
    return out;
  }

  /* ---------- the book's own items (verbatim words, p.31) ---------- */
  var B = { book: W("book"), stop: W("stop"), exit: W("exit"), staff: W("staff"), hand: W("hand"), sign: W("sign") };
  function bookSame(target, a, b, c, answer) {
    return {
      text: "Which word starts like <b>" + target + "</b>?",
      say: "Which word starts with the same sound as " + target + "?",
      target: B[target], options: [B[a], B[b], B[c]], answer: [answer],
      hint2: "Listen. " + target + ". " + target + "."
    };
  }
  function bookTwo(a, b, c, answers) {
    return {
      text: "Two words start the same. Tap them both.",
      say: "Two words start with the same sound. Tap them both.",
      options: [B[a], B[b], B[c]], answer: answers
    };
  }
  var BOOK_SIX = {
    text: "Find three words that start with the same sound.",
    say: "Read the words. Find three words that start with the same sound.",
    options: [B.book, B.stop, B.exit, B.staff, B.hand, B.sign],
    answer: ["stop", "staff", "sign"]
  };

  var CONTENT = {
    levels: [
      { name: "Warm Up", art: "sun",
        make: function () {
          return [{ banner: "Level 1", bannerSay: "Level one. Warm up! Find the word that starts the same.", markFirst: true,
            items: manyStarts(5, 2) }];
        } },
      { name: "Sign Words", art: "stop", ribbon: "Book",
        rounds: [
          { banner: "Level 2", bannerSay: "Level two. Sign words from your book!", markFirst: true,
            items: [bookSame("stop", "staff", "book", "hand", "staff"),
                    bookSame("sign", "exit", "stop", "hand", "stop"),
                    bookSame("staff", "book", "sign", "exit", "sign")] },
          { banner: "Find two", bannerSay: "Now find two words that start the same.", markFirst: true,
            items: [bookTwo("stop", "hand", "sign", ["stop", "sign"]),
                    bookTwo("book", "staff", "stop", ["staff", "stop"]),
                    bookTwo("exit", "sign", "staff", ["sign", "staff"])] }
        ] },
      { name: "Same Start", art: "ball",
        make: function () {
          return [{ banner: "Level 3", bannerSay: "Level three. Which word starts the same?", markFirst: true,
            items: manyStarts(6, 3) }];
        } },
      { name: "Find Two", art: "fish",
        make: function () {
          return [{ banner: "Level 4", bannerSay: "Level four. Find two words that start the same.", markFirst: true,
            items: many(findTwo, 5, 2) }];
        } },
      { name: "Odd One Out", art: "duck",
        make: function () {
          return [{ banner: "Level 5", bannerSay: "Level five. Odd one out! Find the word that starts with a different sound.", markFirst: true,
            items: many(oddOneOut, 5, 2) }];
        } },
      { name: "Super Star", art: "lion",
        make: function () {
          return [{ banner: "Level 6", bannerSay: "Level six. Super star challenge! Find three words that start the same.", markFirst: true,
            shuffle: false,
            items: [BOOK_SIX].concat(many(findThree, 2, 3)) }];
        } }
    ]
  };

  TapIdentify.init(CONTENT);
  Shell.boot({
    asset: "ENG01CH02SAMESOUND",
    version: "v-02",
    title: "Same First Sound",
    kicker: "Grade 1 · Chapter 2",
    intro: "Find words that start with the same sound.",
    levels: CONTENT.levels,
    start: TapIdentify.start,
    resume: TapIdentify.resume,
    score: function () { return TapIdentify.score || 0; },
    max: TapIdentify.max
  });
})();
