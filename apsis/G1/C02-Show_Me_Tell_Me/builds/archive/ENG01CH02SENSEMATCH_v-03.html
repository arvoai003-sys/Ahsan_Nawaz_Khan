<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="asset" content="ENG01CH02SENSEMATCH v-03">
<title>Sense and Body Part</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* ARVO Grade 1 shell: bright nursery theme shared by every APSIS G1 asset. */
:root {
  --ink: #2E2A4F;
  --ink-soft: #5B5680;
  --sky-top: #6CCBFF;
  --sky-bottom: #CFF0FF;
  --yellow: #FFD23F; --yellow-d: #E0A800;
  --red: #FF4F6D;    --red-d: #D6204A;
  --blue: #2EA7FF;   --blue-d: #0B7FD6;
  --green: #23C16B;  --green-d: #139650;
  --orange: #FF9F1C; --orange-d: #E07B00;
  --purple: #9B5DE5; --purple-d: #7A3CC8;
  --pink: #FF7BAC;
  --right: #23C16B;
  --card: #FFFFFF;
  --radius: 26px;
  --font-title: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-read: "Andika", "Century Gothic", "Segoe UI", system-ui, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--sky-bottom);
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 70%);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; }

/* scenery: clouds and hills, behind everything */
#scenery { position: fixed; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; z-index: 0; }
#scenery svg { position: absolute; }
#scenery .ground { left: 0; bottom: 0; width: 100%; height: 22%; min-height: 90px; }
#scenery .cloud { width: 150px; height: 70px; opacity: .95; animation: drift 40s linear infinite; }
#scenery .c1 { top: 12%; left: -10%; }
#scenery .c2 { top: 30%; left: 70%; width: 110px; animation-duration: 55s; animation-delay: -20s; }
#scenery .c3 { top: 6%; left: 40%; width: 90px; animation-duration: 65s; animation-delay: -35s; }
@keyframes drift { 0% { transform: translateX(-20vw); } 100% { transform: translateX(120vw); } }

#app { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; z-index: 1; }

/* ---------- screens ---------- */
.screen { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: none; flex-direction: column; }
.screen.on { display: flex; }

/* ---------- chunky candy buttons ---------- */
.big-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-width: 150px; min-height: 72px; padding: 0 26px; border: 4px solid var(--ink); border-radius: 40px;
  background: var(--yellow); color: var(--ink); font-family: var(--font-title);
  font-weight: 800; font-size: 26px; cursor: pointer; white-space: nowrap;
  box-shadow: 0 7px 0 var(--ink); transition: transform .08s, box-shadow .08s;
}
.big-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
.big-btn.green { background: var(--green); color: #fff; }
.big-btn.blue { background: var(--blue); color: #fff; }
.big-btn.pink { background: var(--pink); color: #fff; }
.big-btn .ic { width: 30px; height: 30px; display: inline-block; }
.big-btn .ic svg { width: 100%; height: 100%; }
.btn-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }

.icon-btn {
  width: 62px; height: 62px; border-radius: 50%; border: 4px solid var(--ink); background: var(--card);
  box-shadow: 0 5px 0 var(--ink); display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex: 0 0 auto; padding: 0;
}
.icon-btn svg { width: 30px; height: 30px; }
.icon-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.icon-btn.talk { background: var(--blue); color: #fff; }
.icon-btn.talk svg { fill: #fff; }
.icon-btn.home { background: var(--green); }
.icon-btn.home svg { width: 36px; height: 36px; }
.icon-btn.pause { background: var(--yellow); }
.icon-btn.music { background: var(--pink); }
.icon-btn.music svg { width: 30px; height: 30px; }
.icon-btn.music.off { background: #C9C4DA; }
.icon-btn.music.off::after { content: ""; position: absolute; width: 40px; height: 5px; background: var(--ink); border-radius: 3px; transform: rotate(-45deg); }
.icon-btn { position: relative; }

/* ---------- home: level picker ---------- */
.home-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 14px 16px 18px; min-height: 0; overflow-y: auto; }
.home-head { display: flex; align-items: center; gap: 12px; margin: 4px 0 12px; }
.home-head .mascot { width: 96px; height: 96px; flex: 0 0 auto; animation: bob 2.4s ease-in-out infinite; }
.home-head .mascot svg { width: 100%; height: 100%; }
.home-title .kicker {
  font-weight: 800; letter-spacing: .08em; font-size: 14px; color: #fff;
  background: var(--purple); border-radius: 20px; padding: 2px 12px; display: inline-block;
  border: 3px solid var(--ink);
}
.home-title h1 {
  font-family: var(--font-title); font-weight: 800; font-size: 40px; line-height: 1; margin: 6px 0 0;
  color: #fff; -webkit-text-stroke: 2px var(--ink); text-shadow: 0 4px 0 var(--ink);
}
.home-head .icon-btn { margin-left: 4px; }
.choose { font-family: var(--font-title); font-weight: 800; font-size: 24px; color: var(--ink); margin: 0; }
.choose-row { display: flex; align-items: center; gap: 14px; margin: 0 0 16px; }
.choose-row .icon-btn { width: 54px; height: 54px; }

.levels { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; max-width: 760px; }
.level {
  position: relative; width: 210px; min-height: 170px; border-radius: 28px; border: 4px solid var(--ink);
  background: var(--yellow); box-shadow: 0 8px 0 var(--ink); cursor: pointer; padding: 12px 10px 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  transition: transform .1s, box-shadow .1s; outline: none;
}
.level:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--ink); }
.level:focus-visible { outline: 5px solid #fff; }
.level .num {
  position: absolute; top: -14px; left: -10px; width: 46px; height: 46px; border-radius: 50%;
  background: #fff; border: 4px solid var(--ink); font-family: var(--font-title); font-weight: 800;
  font-size: 26px; line-height: 38px; text-align: center;
}
.level .art { width: 80px; height: 80px; background: #fff; border-radius: 50%; border: 4px solid var(--ink); padding: 8px; }
.level .art svg { width: 100%; height: 100%; }
.level .name { font-family: var(--font-title); font-weight: 800; font-size: 24px; color: #fff; -webkit-text-stroke: 1px var(--ink); text-shadow: 0 3px 0 var(--ink); line-height: 1.1; text-align: center; margin-top: 4px; }
.level .lstars { display: flex; gap: 2px; margin-top: 4px; }
.level .lstars svg { width: 26px; height: 26px; }
.level .ribbon {
  position: absolute; top: -12px; right: -8px; background: #fff; border: 3px solid var(--ink); border-radius: 12px;
  font-weight: 800; font-size: 14px; padding: 0 8px; transform: rotate(6deg);
}
.level.c0 { background: var(--yellow); } .level.c1 { background: var(--red); } .level.c2 { background: var(--blue); }
.level.c3 { background: var(--green); } .level.c4 { background: var(--orange); } .level.c5 { background: var(--purple); }

/* ---------- panels (end, pause) ---------- */
.panel-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; }
.panel {
  background: var(--card); border-radius: 34px; border: 5px solid var(--ink); box-shadow: 0 10px 0 var(--ink);
  padding: 22px 22px 26px; width: 92vw; max-width: 500px; text-align: center; position: relative;
}
.panel h1 {
  font-family: var(--font-title); font-weight: 800; font-size: 46px; line-height: 1; margin: 4px 0 6px;
  color: var(--orange); -webkit-text-stroke: 2px var(--ink); text-shadow: 0 4px 0 var(--ink);
}
.panel .mascot { width: 110px; height: 110px; margin: -70px auto 0; display: block; animation: bob 2.4s ease-in-out infinite; }
.panel .mascot svg { width: 100%; height: 100%; }
.panel .sub { font-size: 20px; font-weight: 700; color: var(--ink-soft); margin: 2px 0 8px; }

/* ---------- top bar ---------- */
.topbar { flex: 0 0 auto; height: 80px; display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
.progress { flex: 1; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.progress i {
  width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid var(--ink);
  display: block; opacity: .75;
}
.progress i.done { background: var(--green); opacity: 1; }
.progress i.now { background: var(--yellow); opacity: 1; transform: scale(1.25); }
.star-count {
  display: flex; align-items: center; gap: 4px; font-family: var(--font-title);
  font-weight: 800; font-size: 26px; background: var(--card); border-radius: 30px; border: 4px solid var(--ink);
  padding: 2px 14px 2px 6px; box-shadow: 0 5px 0 var(--ink);
}
.star-count svg { width: 32px; height: 32px; }
.level-tag {
  font-family: var(--font-title); font-weight: 800; font-size: 18px; color: #fff; background: var(--purple);
  border: 3px solid var(--ink); border-radius: 18px; padding: 2px 10px; white-space: nowrap;
}

/* ---------- stage ---------- */
.stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 4px 16px 24px; gap: 18px; min-height: 0; }
.prompt {
  display: flex; align-items: center; gap: 12px; background: var(--card);
  border-radius: 30px; border: 4px solid var(--ink); padding: 8px 18px 8px 8px; box-shadow: 0 6px 0 var(--ink);
  max-width: 660px;
}
.prompt .say { width: 58px; height: 58px; flex: 0 0 auto; }
.prompt-text { font-family: var(--font-read); font-weight: 700; font-size: 26px; font-size: clamp(20px, 5vw, 26px); line-height: 1.25; }
.prompt-text b { color: var(--red); }
.counter { display: flex; gap: 6px; margin-left: 4px; }
.counter b { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--ink); background: #fff; display: block; }
.counter b.got { background: var(--green); }

/* round banner */
.banner {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: none; align-items: center; justify-content: center;
  z-index: 30;
}
.banner.on { display: flex; }
.banner div {
  font-family: var(--font-title); font-weight: 800; font-size: 56px; font-size: clamp(36px, 10vw, 60px);
  color: #fff; -webkit-text-stroke: 2px var(--ink); text-shadow: 0 5px 0 var(--ink);
  background: var(--pink); border: 5px solid var(--ink); border-radius: 34px; padding: 10px 34px;
  box-shadow: 0 10px 0 var(--ink); animation: pop .5s cubic-bezier(.2,1.6,.4,1); text-align: center;
}

/* ---------- pause overlay ---------- */
.overlay {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(46,42,79,.5); display: none;
  align-items: center; justify-content: center; z-index: 50; padding: 16px;
}
.overlay.on { display: flex; }
.menu { display: flex; flex-direction: column; gap: 16px; margin-top: 10px; }
.menu .big-btn { width: 100%; }

/* ---------- feedback ---------- */
.shake { animation: shake .45s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-12px) rotate(-3deg)} 40%{transform:translateX(10px) rotate(2deg)} 60%{transform:translateX(-7px)} 80%{transform:translateX(5px)} }
@keyframes pop { 0%{transform:scale(.3);opacity:0} 100%{transform:scale(1);opacity:1} }
@keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
@keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-6deg)} 75%{transform:rotate(6deg)} }

.praise {
  position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%);
  font-family: var(--font-title); font-weight: 800; font-size: 72px; font-size: clamp(44px, 13vw, 80px);
  color: var(--yellow); -webkit-text-stroke: 3px var(--ink); text-shadow: 0 6px 0 var(--ink);
  pointer-events: none; z-index: 40; display: none; white-space: nowrap;
}
.praise.on { display: block; animation: pop .45s cubic-bezier(.2,1.6,.4,1); }

#confetti { position: fixed; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; z-index: 45; }

/* tutorial hand */
.hand {
  position: fixed; width: 76px; height: 76px; z-index: 60; pointer-events: none;
  display: none; transition: left .9s ease-in-out, top .9s ease-in-out;
  filter: drop-shadow(0 4px 4px rgba(0,0,0,.25));
}
.hand.on { display: block; }
.hand.tap { animation: tap .5s ease-in-out 2; }
@keyframes tap { 0%,100%{transform:scale(1)} 50%{transform:scale(.82)} }

/* end stars */
.end-stars { display: flex; justify-content: center; gap: 6px; margin: 6px 0 8px; }
.end-stars svg { width: 76px; height: 76px; }
.end-stars svg.lit { animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }
.end-stars svg:nth-child(2) { animation-delay: .25s; margin-top: -16px; }
.end-stars svg:nth-child(3) { animation-delay: .5s; }

@media (max-width: 520px) {
  .home-wrap { padding-top: 8px; }
  .home-head { margin: 0 0 6px; }
  .home-head .mascot { width: 64px; height: 64px; }
  .home-title h1 { font-size: 28px; }
  .home-title .kicker { font-size: 12px; }
  .choose { font-size: 20px; }
  .choose-row { margin-bottom: 14px; gap: 10px; }
  .choose-row .icon-btn { width: 48px; height: 48px; }
  .levels { gap: 14px 12px; }
  .level { width: 46%; min-height: 112px; padding: 6px 6px 5px; border-radius: 24px; }
  .level .art { width: 48px; height: 48px; padding: 4px; }
  .level .name { line-height: 1.05; }
  .choose-row { margin-bottom: 12px; }
  .level .name { font-size: 19px; }
  .level .lstars svg { width: 20px; height: 20px; }
  .topbar { gap: 8px; padding: 8px; }
  .icon-btn { width: 54px; height: 54px; }
  .level-tag { display: none; }
  .progress { gap: 4px; }
  .progress i { width: 13px; height: 13px; border-width: 2.5px; }
  .star-count { font-size: 22px; padding: 2px 10px 2px 4px; }
  .star-count svg { width: 26px; height: 26px; }
  .panel h1 { font-size: 38px; }
}
@media (max-height: 520px) {
  .topbar { height: 66px; }
  .icon-btn { width: 52px; height: 52px; }
  .stage { gap: 10px; padding-bottom: 10px; }
  .home-wrap { padding-top: 6px; }
  .home-head { margin: 0 0 6px; }
  .home-head .mascot { width: 60px; height: 60px; }
  .home-title h1 { font-size: 30px; }
  .choose { display: none; }
  .choose-row { position: absolute; top: 8px; right: 10px; margin: 0; }
  .choose-row .icon-btn { width: 48px; height: 48px; }
  .levels { max-width: none; flex-wrap: nowrap; gap: 10px; }
  .level { width: 112px; min-height: 150px; padding: 10px 4px 6px; }
  .level .art { width: 58px; height: 58px; padding: 5px; }
  .level .name { font-size: 17px; }
  .level .lstars svg { width: 18px; height: 18px; }
  .panel { padding: 12px 16px 16px; }
  .panel .mascot { width: 70px; height: 70px; margin-top: -44px; }
  .panel h1 { font-size: 34px; }
  .end-stars svg { width: 50px; height: 50px; }
  .end-stars { margin: 2px 0 4px; }
  .panel .sub { margin: 0 0 2px; font-size: 17px; }
  .btn-row { flex-wrap: nowrap; gap: 10px; margin-top: 4px; }
  .btn-row .big-btn { min-width: 0; min-height: 60px; padding: 0 16px; font-size: 21px; }
  .menu { gap: 10px; }
  .menu .big-btn { min-height: 54px; font-size: 21px; }
  #scenery .ground { height: 16%; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ================= themes (one look per game) ================= */
body.theme-meadow { background: linear-gradient(180deg, #6CCBFF 0%, #CFF0FF 70%); }
body.theme-sunset { background: linear-gradient(180deg, #FF8A5B 0%, #FFB36B 40%, #FFE0B2 78%); }
body.theme-garden { background: linear-gradient(180deg, #C9B6FF 0%, #E6DCFF 45%, #E8FFF0 80%); }
body.theme-school { background: linear-gradient(180deg, #3FD0C9 0%, #A8F0E8 55%, #E6FFFB 80%); }
body.theme-rainbow { background: linear-gradient(180deg, #FFE9A8 0%, #FFD6E8 50%, #FFF3F8 80%); --t-title: #2EA7FF; }
#scenery .rainbow { position: absolute; left: 50%; bottom: 14%; width: 70%; max-width: 760px; transform: translateX(-50%); opacity: .55; }
body.theme-rainbow .level { border-radius: 36px; }
body.theme-rainbow .level.c0 { background: #2EA7FF; } body.theme-rainbow .level.c1 { background: #FF4F6D; } body.theme-rainbow .level.c2 { background: #23C16B; }
body.theme-rainbow .level.c3 { background: #9B5DE5; } body.theme-rainbow .level.c4 { background: #FF9F1C; } body.theme-rainbow .level.c5 { background: #FF7BAC; }
body.theme-rainbow .banner div { background: #2EA7FF; } body.theme-rainbow .progress i.now { background: #2EA7FF; }
#scenery .sun { position: absolute; width: 150px; height: 150px; left: 8%; top: 8%; }
#scenery .bfly { position: absolute; width: 44px; height: 34px; animation: flutter 7s ease-in-out infinite; }
#scenery .b1 { left: 10%; top: 30%; } #scenery .b2 { right: 12%; top: 22%; animation-delay: -3s; }
@keyframes flutter { 0%,100% { transform: translate(0,0) scaleX(1); } 25% { transform: translate(30px,-20px) scaleX(.7); } 50% { transform: translate(60px,0) scaleX(1); } 75% { transform: translate(30px,20px) scaleX(.7); } }

/* ================= home: big, bold title ================= */
.home-head { flex-direction: column; gap: 4px; margin: 2px 0 8px; }
.home-title { display: flex; align-items: center; gap: 12px; justify-content: center; }
.home-title .hero-art { width: 84px; height: 84px; flex: 0 0 auto; background: #fff; border: 5px solid var(--ink); border-radius: 50%; padding: 8px; box-shadow: 0 6px 0 var(--ink); animation: bob 2.6s ease-in-out infinite; }
.home-title .hero-art:empty { display: none; }
.home-title .hero-art svg { width: 100%; height: 100%; }
.home-title h1 {
  font-family: var(--font-title); font-weight: 800; line-height: .95; margin: 0; text-align: left;
  font-size: 64px; font-size: clamp(40px, 8.5vw, 76px);
  color: var(--t-title, #fff); -webkit-text-stroke: 3px var(--ink); text-shadow: 0 6px 0 var(--ink), 0 10px 18px rgba(46,42,79,.25);
  letter-spacing: .01em;
}
body.theme-meadow { --t-title: #FFD23F; }
body.theme-sunset { --t-title: #FFFFFF; }
body.theme-garden { --t-title: #FF7BAC; }
body.theme-school { --t-title: #FF9F1C; }
.home-head .mascot { display: none; }
body.has-buddy .home-head .mascot { display: block; position: fixed; left: 8px; bottom: 6px; width: 96px; height: 160px; z-index: 2; animation: none; }

/* level tiles take the theme's colours and shape */
body.theme-sunset .level { border-radius: 16px; }
body.theme-sunset .level.c0 { background: #FF4F6D; } body.theme-sunset .level.c1 { background: #2EA7FF; } body.theme-sunset .level.c2 { background: #9B5DE5; }
body.theme-sunset .level.c3 { background: #23C16B; } body.theme-sunset .level.c4 { background: #FF9F1C; } body.theme-sunset .level.c5 { background: #5B5680; }
body.theme-garden .level { border-radius: 60px 60px 26px 26px; }
body.theme-garden .level.c0 { background: #FF7BAC; } body.theme-garden .level.c1 { background: #9B5DE5; } body.theme-garden .level.c2 { background: #23C16B; }
body.theme-garden .level.c3 { background: #FF9F1C; } body.theme-garden .level.c4 { background: #2EA7FF; } body.theme-garden .level.c5 { background: #FF4F6D; }
body.theme-school .level { border-radius: 22px 22px 22px 6px; }
body.theme-school .level.c0 { background: #FF9F1C; } body.theme-school .level.c1 { background: #23C16B; } body.theme-school .level.c2 { background: #FF4F6D; }
body.theme-school .level.c3 { background: #2EA7FF; } body.theme-school .level.c4 { background: #9B5DE5; } body.theme-school .level.c5 { background: #FFD23F; }
body.theme-school .level.c5 .name { color: #fff; }
body.theme-sunset .banner div { background: #FF4F6D; } body.theme-garden .banner div { background: #9B5DE5; } body.theme-school .banner div { background: #FF9F1C; }
body.theme-sunset .progress i.now { background: #FF4F6D; } body.theme-garden .progress i.now { background: #FF7BAC; } body.theme-school .progress i.now { background: #FF9F1C; }

/* ================= buddy (an unnamed child) ================= */
.buddy { width: 100%; height: 100%; }
.buddy svg { width: 100%; height: 100%; overflow: visible; }
.buddy .b-all { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe-b 3s ease-in-out infinite; }
.buddy .b-eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4.2s infinite; }
.buddy .b-arm { transform-box: fill-box; transition: transform .25s; }
.buddy .b-arm-l { transform-origin: 90% 0%; } .buddy .b-arm-r { transform-origin: 10% 0%; }
.buddy .b-head { transform-box: fill-box; transform-origin: 50% 90%; transition: transform .3s; }
.buddy .b-talk { display: none; }
.buddy.talk .b-smile { display: none; }
.buddy.talk .b-talk { display: block; transform-box: fill-box; transform-origin: 50% 20%; animation: yap .22s ease-in-out infinite alternate; }
.buddy.wave .b-arm-r { animation: wave .5s ease-in-out 4 alternate; }
.buddy.cheer .b-all { animation: hop .5s ease-in-out 2; }
.buddy.cheer .b-arm-l { transform: rotate(150deg); } .buddy.cheer .b-arm-r { transform: rotate(-150deg); }
.buddy.think .b-head { transform: rotate(-9deg); }
.buddy.think .b-arm-r { transform: rotate(-40deg); }
@keyframes breathe-b { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.015,.985); } }
@keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes yap { from { transform: scaleY(.35); } to { transform: scaleY(1); } }
@keyframes wave { from { transform: rotate(-150deg); } to { transform: rotate(-110deg); } }
@keyframes hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14%); } }

.game-buddy { position: fixed; left: 6px; bottom: 4px; width: 76px; height: 118px; pointer-events: none; z-index: 2; display: none; }
body.has-buddy .game-buddy { display: block; transition: opacity .25s, transform .25s; }
body.has-buddy .game-buddy.away { opacity: 0; transform: translateX(-110%); }
.game-buddy .buddy { position: absolute; left: 0; bottom: 0; width: 70px; height: 118px; }

body.has-buddy .panel .mascot { width: 92px; height: 150px; margin: -118px auto 0; animation: none; }

@media (max-width: 520px) {
  .home-title h1 { font-size: 34px; }
  .home-title .hero-art { width: 58px; height: 58px; padding: 5px; border-width: 4px; }
  .home-title h1 { -webkit-text-stroke: 2px var(--ink); text-shadow: 0 4px 0 var(--ink); }
  body.has-buddy .home-head .mascot { display: none; }
  .game-buddy { width: 50px; height: 80px; left: 2px; }
  .game-buddy .buddy { width: 48px; height: 80px; }
  }
@media (max-height: 520px) {

  .home-head { align-self: flex-start; margin-left: 6px; }
  .home-title .hero-art { width: 50px; height: 50px; padding: 4px; }

  .game-buddy { width: 48px; height: 76px; }
  .game-buddy .buddy { width: 46px; height: 76px; }
    body.has-buddy .panel .mascot { display: none; }
}

/* Match board: word chips dragged (or tapped) onto picture / sentence targets */
.mt { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; max-width: 900px; }
.targets { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }
.target {
  position: relative; width: 170px; min-height: 196px; background: #fff; border: 4px solid var(--ink); border-radius: 26px;
  box-shadow: 0 8px 0 var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: 12px 10px 10px; cursor: pointer; animation: pop .4s cubic-bezier(.2,1.6,.4,1) both; transition: transform .12s;
}
.targets .target:nth-child(2) { animation-delay: .07s; } .targets .target:nth-child(3) { animation-delay: .14s; }
.targets .target:nth-child(4) { animation-delay: .21s; } .targets .target:nth-child(5) { animation-delay: .28s; }
.target .art { width: 96px; height: 96px; border-radius: 50%; border: 3px solid var(--ink); padding: 8px; background: #FFF1B8; }
.target.k1 .art { background: #FFD6DE; } .target.k2 .art { background: #CDEBFF; } .target.k3 .art { background: #CFF5DE; }
.target.k4 .art { background: #FFE2C2; } .target.k5 .art { background: #E6D6FA; }
.target .art svg { width: 100%; height: 100%; }
.target .cap { font-family: var(--font-read); font-weight: 700; font-size: 24px; line-height: 1.15; text-align: center; margin-top: 6px; }
.target .drop {
  margin-top: 8px; min-width: 120px; min-height: 58px; border-radius: 30px; border: 4px dashed var(--purple);
  background: #F3EBFF; display: flex; align-items: center; justify-content: center; animation: breathe 1.6s ease-in-out infinite;
}
.target.hot { transform: scale(1.06); }
.target.hot .drop { background: #FFF1B8; border-color: var(--orange); }
.target.done .drop { border: 4px solid var(--green); background: #D8F7E4; animation: none; }
.target.done { border-color: var(--green); box-shadow: 0 8px 0 var(--green-d), 0 0 0 6px #B8F0CE; cursor: default; }
.target.glow { animation: slotglow .9s ease-in-out 3; }
@keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
@keyframes slotglow { 0%,100% { box-shadow: 0 8px 0 var(--ink); } 50% { box-shadow: 0 8px 0 var(--ink), 0 0 0 8px var(--yellow); } }

/* sentence target (one wide card with a gap) */
.target.sentence { width: auto; max-width: 640px; min-height: 0; flex-direction: row; gap: 16px; padding: 14px 20px; }
.target.sentence .cap { font-size: 34px; text-align: left; margin: 0; }
.target.sentence .drop { display: inline-flex; vertical-align: middle; margin: 0 4px; min-width: 110px; min-height: 54px; }
.target.sentence .art { flex: 0 0 auto; }

/* chips */
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; min-height: 70px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; min-height: 62px; min-width: 110px; padding: 6px 22px 6px 8px;
  border-radius: 34px; border: 4px solid var(--ink); box-shadow: 0 6px 0 var(--ink); cursor: grab; touch-action: none;
  font-family: var(--font-read); font-weight: 700; font-size: 30px; color: var(--ink);
  animation: pop .4s cubic-bezier(.2,1.6,.4,1) both; transition: transform .12s, box-shadow .12s;
}
.chip .dot { width: 44px; height: 44px; border-radius: 50%; background: #fff; border: 3px solid var(--ink); padding: 3px; flex: 0 0 auto; }
.chip .dot svg { width: 100%; height: 100%; }
.chip.k0 { background: #FFD23F; } .chip.k1 { background: #FF8FA3; } .chip.k2 { background: #7EC8FF; }
.chip.k3 { background: #7BE3A6; } .chip.k4 { background: #FFB866; } .chip.k5 { background: #C7A6F5; }
.chip.picked { transform: translateY(-8px) scale(1.06); box-shadow: 0 12px 0 var(--ink), 0 0 0 6px #fff; }
.chip.dragging { position: fixed; z-index: 70; cursor: grabbing; transform: scale(1.1) rotate(-3deg); box-shadow: 0 14px 20px rgba(0,0,0,.25); animation: none; transition: none; }
.chip.ghost { opacity: .25; }
.chip.placed { box-shadow: none; border-color: var(--green-d); cursor: default; animation: pop .35s cubic-bezier(.2,1.6,.4,1); font-size: 26px; min-height: 50px; padding-right: 16px; }
.chip.placed .dot { width: 36px; height: 36px; }

@media (max-width: 520px) {
  .mt { gap: 14px; }
  .targets { gap: 12px; }
  .target { width: 100px; min-height: 150px; padding: 8px 5px; border-radius: 22px; }
  .target .art { width: 62px; height: 62px; padding: 5px; }
  .target .cap { font-size: 18px; }
  .target .drop { min-width: 84px; min-height: 48px; }
  .target.sentence { flex-direction: column; padding: 12px; width: 92vw; }
  .target.sentence .cap { font-size: 26px; text-align: center; }
  .chips { gap: 10px; }
  .chip { min-height: 54px; min-width: 90px; font-size: 24px; padding: 4px 14px 4px 6px; }
  .chip .dot { width: 36px; height: 36px; }
  .chip.placed { font-size: 17px; min-height: 40px; min-width: 0; padding: 2px 8px 2px 3px; gap: 3px; }
  .chip.placed .dot { width: 26px; height: 26px; padding: 2px; }
  .mt.five .targets { gap: 10px; }
  .mt.five .target { width: 96px; min-height: 0; padding: 6px 4px 8px; }
  .mt.five .target .art { width: 48px; height: 48px; }
  .mt.five .target .drop { min-width: 80px; min-height: 42px; margin-top: 4px; }
  .mt.five .chip { min-height: 50px; min-width: 80px; padding: 4px 14px; }
}
@media (max-height: 520px) {
  .mt { flex-direction: row; align-items: center; justify-content: center; gap: 22px; }
  .targets { gap: 10px; flex-wrap: nowrap; }
  .target { width: 124px; min-height: 0; padding: 6px 6px 8px; }
  .target .art { width: 54px; height: 54px; padding: 4px; }
  .target .cap { font-size: 18px; margin-top: 2px; }
  .target .drop { min-height: 44px; min-width: 96px; margin-top: 4px; }
  .target.sentence { padding: 8px 14px; max-width: 420px; }
  .target.sentence .cap { font-size: 24px; }
  .chips { flex-direction: column; flex-wrap: wrap; max-height: 250px; max-height: calc(100vh - 176px); min-height: 0; gap: 10px; align-content: center; }
  .chip { min-height: 52px; font-size: 22px; min-width: 96px; }
  .chip .dot { width: 34px; height: 34px; }
  .chip.placed { font-size: 17px; min-height: 40px; min-width: 0; padding: 2px 8px 2px 3px; }
  .chip.placed .dot { width: 26px; height: 26px; }
  .mt.five { gap: 14px; }
  .mt.five .targets { gap: 8px; }
  .mt.five .target { width: 88px; }
  .mt.five .target .art { width: 46px; height: 46px; }
  .mt.five .target .drop { min-width: 76px; }
  .mt.five .chip { min-width: 84px; padding: 4px 14px; font-size: 20px; }
}
@media (min-width: 900px) and (min-height: 640px) {
  .target { width: 190px; min-height: 220px; }
  .target .art { width: 116px; height: 116px; }
  .target .cap { font-size: 28px; }
  .chip { font-size: 34px; min-height: 70px; }
  .mt.five .target { width: 160px; min-height: 200px; }
  .mt.five .target .art { width: 92px; height: 92px; }
}

<div id="scenery" aria-hidden="true"></div>

<div id="app">

  <section class="screen on" id="home">

      <div class="home-head">

      </div>

  <section class="screen" id="game">

    <div class="game-buddy" id="game-buddy"></div>

  <section class="screen" id="end">

        <div class="mascot" id="end-mascot"></div>

          <button class="big-btn" id="end-home-btn" type="button"><span class="ic" id="end-home-ic"></span>Home</button>

      </div>

  </section>

</div>

<div class="overlay" id="pause">
  <div class="panel">

    <div class="menu">
      <button class="big-btn green" id="resume-btn" type="button">&#9654; Resume</button>
      <button class="big-btn blue" id="sound-btn" type="button">Sound: on</button>
      <button class="big-btn" id="music-btn" type="button">Music: on</button>
      <button class="big-btn pink" id="restart-btn" type="button">&#8635; Restart</button>
      <button class="big-btn" id="menu-home-btn" type="button">Home</button>
    </div>
  </div>
</div>

  /* the child's drawing, for games that use it as a picture (e.g. body parts) */
  B.kidInner = function () {
    return KID.replace(/^<svg[^>]*>/, "").replace(/<\/svg>$/, "").replace(/<ellipse class="b-talk"[^>]*\/>/, "");
  };

  B.mount = function (who) {
    if (who !== "kid") { return; }
    el = Shell.el("div", "buddy idle", KID);
    document.body.className += " has-buddy";
    Shell.on("talk", setTalk);
    Shell.on("right", function () { setMood("cheer", 1400); });
    Shell.on("wrong", function () { setMood("think", 1600); });
    Shell.on("screen", place);
    Shell.on("layout", soon);
    window.addEventListener("resize", soon);
  };
  return B;
})();

/* ---- match.js ---- */
/* Match engine. The child drags a word chip onto the right target (a picture
   card or a sentence with a gap), or taps a chip and then a target. With a
   single target, tapping a chip answers straight away.
   Content: { levels: [ { name, art, ribbon, make() | rounds } ] }
   round:   { banner, bannerSay, items: [ screen ] }
   screen:  { text, say, targets: [ { id, art, cap, sentence, say, done } ],
              chips: [ { text, art, say, goes } ] }
     cap       text on the card; in a sentence "___" marks the gap
     done      what to say when the target is matched (e.g. the book sentence)
     goes      id of the chip's target; chips with no "goes" are distractors
   ES5 only. Needs Shell and Art. */
var Match = (function () {
  var T = {};
  var C, flat, idx, item, attempts, locked, firstTry, starTotal, tutorialDone, picked, drag = null, left;

  T.LINES = ["Oops! Try again.", "Tap a word, or drag it to its picture.", "Tap here to hear it again.", "Listen carefully."];

  function lock(v) {
    locked = v;
    var st = Shell.$("stage");
    if (st) { st.setAttribute("data-ready", v ? "0" : "1"); }
  }
  function instructionFor(it) { return it.say || it.text; }
  function instruction() { return instructionFor(item); }
  /* every line a screen can speak (tools/voice_lines.js) */
  T.linesFor = function (it) {
    var out = [instructionFor(it)], i;
    for (i = 0; i < it.targets.length; i++) { out.push(it.targets[i].say || it.targets[i].cap); if (it.targets[i].done) { out.push(it.targets[i].done); } }
    for (i = 0; i < it.chips.length; i++) { out.push(it.chips[i].say || it.chips[i].text); }
    return out;
  };

  function capHtml(t) {
    if (!t.cap) { return ""; }
    return '<div class="cap">' + t.cap.replace("___", '<span class="drop"></span>') + "</div>";
  }

  function render() {
    var st = Shell.$("stage"), i, tint = Math.floor(Math.random() * 6);
    st.innerHTML = "";
    attempts = 0; firstTry = true; picked = null; lock(true);
    left = 0;

    var prompt = Shell.el("div", "prompt");
    var sayBtn = Shell.speakerBtn("say", "Hear it again");
    sayBtn.onclick = function () { Shell.say(instruction()); };
    prompt.appendChild(sayBtn);
    prompt.appendChild(Shell.el("div", "prompt-text", item.text));
    st.appendChild(prompt);

    var board = Shell.el("div", "mt" + (item.targets.length >= 5 ? " five" : ""));
    var tbox = Shell.el("div", "targets");
    var targets = Shell.shuffle(item.targets);
    for (i = 0; i < targets.length; i++) {
      (function (t, k) {
        var sentence = t.cap && t.cap.indexOf("___") > -1;
        var el = Shell.el("div", "target k" + ((tint + k) % 6) + (sentence ? " sentence" : ""));
        el.innerHTML = (t.art ? '<div class="art">' + Art.get(t.art) + "</div>" : "") + capHtml(t) + (sentence ? "" : '<div class="drop"></div>');
        el.setAttribute("role", "button");
        el.setAttribute("aria-label", (t.say || t.cap || t.id).replace("___", "blank"));
        el.data = t;
        el.onclick = function () {
          if (picked && !locked) { tryDrop(picked, el); return; }
          if (el.className.indexOf("done") < 0) { Shell.say(t.say || t.cap.replace("___", "...")); }
        };
        tbox.appendChild(el);
        left++;
      })(targets[i], i);
    }
    board.appendChild(tbox);

    var cbox = Shell.el("div", "chips");
    var chips = Shell.shuffle(item.chips);
    for (i = 0; i < chips.length; i++) {
      (function (c, k) {
        var el = Shell.el("div", "chip k" + ((tint + k + 2) % 6), (c.art ? '<span class="dot">' + Art.get(c.art) + "</span>" : "") + "<span>" + c.text + "</span>");
        el.setAttribute("role", "button");
        el.setAttribute("tabindex", "0");
        el.setAttribute("aria-label", c.text);
        el.data = c;
        bindChip(el);
        el.onkeydown = function (e) { if (e.keyCode === 13 || e.keyCode === 32) { e.preventDefault(); tapChip(el); } };
        cbox.appendChild(el);
      })(chips[i], i);
    }
    board.appendChild(cbox);
    st.appendChild(board);
    Shell.progress(flat.length, idx);

    var go = Shell.guard(function () {
      if (!tutorialDone) {
        tutorialDone = true;
        Shell.say(instruction(), Shell.guard(function () {
          Shell.tutorial([
            { node: sayBtn, say: "Tap here to hear it again." },
            { node: cbox.children[0], say: "Tap a word, or drag it to its picture." }
          ], Shell.guard(function () { lock(false); }));
        }));
      } else {
        lock(false);
        Shell.say(instruction());
      }
    });
    go();
  }

  /* ---------- tap / drag ---------- */
  function targetEls() { return Shell.$("stage").querySelectorAll(".target"); }
  function targetAt(x, y) {
    var ts = targetEls(), i, r;
    for (i = 0; i < ts.length; i++) {
      if (ts[i].className.indexOf("done") > -1) { continue; }
      r = ts[i].getBoundingClientRect();
      if (x > r.left - 12 && x < r.right + 12 && y > r.top - 12 && y < r.bottom + 12) { return ts[i]; }
    }
    return null;
  }
  function tapChip(el) {
    if (locked || el.className.indexOf("placed") > -1) { return; }
    var open = [], ts = targetEls(), i;
    for (i = 0; i < ts.length; i++) { if (ts[i].className.indexOf("done") < 0) { open.push(ts[i]); } }
    if (open.length === 1) { tryDrop(el, open[0]); return; }
    if (picked) { picked.className = picked.className.replace(" picked", ""); }
    picked = el;
    el.className += " picked";
    Shell.sfx.pop();
    Shell.say(el.data.say || el.data.text);
  }
  function bindChip(el) {
    function down(e) {
      if (locked || drag || el.className.indexOf("placed") > -1) { return; }
      var p = e.touches ? e.touches[0] : e, r = el.getBoundingClientRect();
      drag = { el: el, x0: p.clientX, y0: p.clientY, dx: p.clientX - r.left, dy: p.clientY - r.top, moved: false, clone: null, hot: null };
      if (e.cancelable && e.touches) { e.preventDefault(); }
    }
    el.addEventListener("mousedown", down);
    el.addEventListener("touchstart", down, { passive: false });
  }
  function move(e) {
    if (!drag) { return; }
    var p = e.touches ? e.touches[0] : e;
    if (!drag.moved && Math.abs(p.clientX - drag.x0) + Math.abs(p.clientY - drag.y0) > 10) {
      drag.moved = true;
      var c = drag.el.cloneNode(true);
      c.className = drag.el.className.replace(" picked", "") + " dragging";
      c.style.width = drag.el.offsetWidth + "px";
      document.body.appendChild(c);
      drag.clone = c;
      drag.el.className += " ghost";
    }
    if (drag.moved) {
      drag.clone.style.left = (p.clientX - drag.dx) + "px";
      drag.clone.style.top = (p.clientY - drag.dy) + "px";
      var t = targetAt(p.clientX, p.clientY);
      if (drag.hot && drag.hot !== t) { drag.hot.className = drag.hot.className.replace(" hot", ""); }
      if (t && t !== drag.hot) { t.className += " hot"; }
      drag.hot = t;
      if (e.cancelable) { e.preventDefault(); }
    }
  }
  function up(e) {
    if (!drag) { return; }
    var d = drag, p = e.changedTouches ? e.changedTouches[0] : e;
    drag = null;
    if (d.hot) { d.hot.className = d.hot.className.replace(" hot", ""); }
    if (d.clone) { d.clone.parentNode.removeChild(d.clone); }
    d.el.className = d.el.className.replace(" ghost", "");
    if (!d.moved) { tapChip(d.el); return; }
    var t = targetAt(p.clientX, p.clientY);
    if (t) { tryDrop(d.el, t); }
  }
  document.addEventListener("mousemove", move);
  document.addEventListener("touchmove", move, { passive: false });
  document.addEventListener("mouseup", up);
  document.addEventListener("touchend", up);

  function tryDrop(chip, target) {
    if (locked || chip.className.indexOf("placed") > -1 || target.className.indexOf("done") > -1) { return; }
    if (picked) { picked.className = picked.className.replace(" picked", ""); picked = null; }
    var c = chip.data, t = target.data;
    if (c.goes === t.id) {
      lock(true);
      chip.className = chip.className.replace(" picked", "") + " placed";
      target.querySelector(".drop").appendChild(chip);
      target.className += " done";
      left--;
      var praise = Shell.right(target);
      var after = Shell.guard(function () {
        if (left === 0) {
          if (firstTry) { T.score++; }
          starTotal++; Shell.setStars(starTotal);
          Shell.wait(Shell.guard(next), 500);
        } else {
          lock(false);
        }
      });
      Shell.say([praise].concat(t.done || c.text), after);
    } else {
      firstTry = false;
      attempts++;
      Shell.wrong(chip);
      if (attempts === 1) {
        Shell.say(["Oops! Try again.", t.say || (t.cap || "").replace("___", "...")]);
      } else {
        /* show where it belongs? never. Glow the open targets and read them out */
        var ts = targetEls(), i;
        for (i = 0; i < ts.length; i++) { if (ts[i].className.indexOf("done") < 0) { Shell.flash(ts[i], "glow", 2600); } }
        Shell.say(["Listen carefully.", instruction()]);
      }
    }
  }

  function next() {
    idx++;
    if (idx >= flat.length) {
      Shell.progress(flat.length, flat.length);
      Shell.wait(Shell.guard(function () { Shell.finish(T.score, flat.length); }), 400);
      return;
    }
    item = flat[idx];
    if (item.round !== flat[idx - 1].round && item.round.banner) {
      Shell.$("stage").innerHTML = "";
      Shell.banner(item.round.banner, item.round.bannerSay, Shell.guard(render));
    } else {
      render();
    }
  }

  T.start = function (levelIndex) {
    var r, i, L = C.levels[levelIndex || 0];
    var rounds = L.make ? L.make() : L.rounds;
    flat = [];
    for (r = 0; r < rounds.length; r++) {
      var its = rounds[r].shuffle === false ? rounds[r].items : Shell.shuffle(rounds[r].items);
      for (i = 0; i < its.length; i++) { its[i].round = rounds[r]; flat.push(its[i]); }
    }
    idx = 0; T.score = 0; starTotal = 0;
    item = flat[0];
    if (item.round.banner) { Shell.banner(item.round.banner, item.round.bannerSay, Shell.guard(render)); } else { render(); }
  };
  T.resume = function () { if (item) { Shell.say(instruction()); } };
  T.max = function () { return flat ? flat.length : 0; };
  T.init = function (content) { C = content; tutorialDone = false; T.score = 0; };
  return T;
})();

/* ---- SENSEMATCH.game.js ---- */
// @asset ENG01CH02SENSEMATCH
// @version v-03
// @title Sense and Body Part
// @engine match
/* A14 · Sense and Body Part · Reading and Comprehension > Our Senses(Reading and Comprehension) · O8

   Book, verbatim:
   - p.34 2F (reading text): We see things with our eyes. We hear with our ears.
     We smell with our nose. We taste with our tongue. We touch and feel things
     with our hands. (Level 2 gaps the last word; every correct match in every
     level says the book sentence.)
   - p.38 2I B4: stroke a pet -> touch, sniff a flower -> smell, eat an ice cream
     -> taste. "play in the playground" is withheld: several senses fit.
   Beyond the book (authored, needs Champ's approval): look at the moon (see),
   listen to a drum (hear), eat a banana (taste), hug a teddy (touch),
   sniff the soap (smell). Each uses one sense most clearly. */
(function () {
  var SENSES = [
    { sense: "see", part: "eyes", art: "eyes", book: "We see things with our eyes." },
    { sense: "hear", part: "ears", art: "ears", book: "We hear with our ears." },
    { sense: "smell", part: "nose", art: "nose", book: "We smell with our nose." },
    { sense: "taste", part: "tongue", art: "tongue", book: "We taste with our tongue." },
    { sense: "touch", part: "hands", art: "hand", book: "We touch and feel things with our hands." }
  ];
  var BY = {};
  var i;
  for (i = 0; i < SENSES.length; i++) { BY[SENSES[i].sense] = SENSES[i]; }

  var BOOK_ACTS = [
    { act: "stroke a pet", art: "pet", sense: "touch" },
    { act: "sniff a flower", art: "flower", sense: "smell" },
    { act: "eat an ice cream", art: "icecream", sense: "taste" }
  ];
  var NEW_ACTS = [
    { act: "look at the moon", art: "moon", sense: "see" },
    { act: "listen to a drum", art: "drum", sense: "hear" },
    { act: "eat a banana", art: "banana", sense: "taste" },
    { act: "hug a teddy", art: "toys", sense: "touch" },
    { act: "sniff the soap", art: "soap", sense: "smell" }
  ];

  /* withArt: a small body-part picture on the chip (a clue for activities; never on
     sense-to-body-part screens, where it would give the answer away) */
  function senseChip(s, goes, withArt) { return { text: s.sense, art: withArt ? s.art : null, goes: goes }; }
  function partTarget(s) { return { id: s.sense, art: s.art, cap: s.part, done: s.book }; }
  function otherSenses(not, n) {
    var list = [], k;
    for (k = 0; k < SENSES.length; k++) { if (SENSES[k].sense !== not) { list.push(SENSES[k]); } }
    return Shell.shuffle(list).slice(0, n);
  }

  /* n senses: drag each sense word to its body part */
  function pairsScreen(list) {
    var s = { text: "Match each sense to its body part.", say: "Can you match each sense to its body part?", targets: [], chips: [] }, k;
    for (k = 0; k < list.length; k++) { s.targets.push(partTarget(list[k])); s.chips.push(senseChip(list[k], list[k].sense)); }
    return s;
  }
  /* book sentence with a gap: pick the body part */
  function sentenceScreen(s) {
    var gap = s.book.replace(new RegExp(s.part + "\\.$"), "___."), others = otherSenses(s.sense, 2), k;
    var scr = { text: "Which body part?", say: ["Listen.", gap.replace("___", "..."), "Which body part?"],
      targets: [{ id: "gap", cap: gap, say: gap.replace("___", "..."), done: s.book }],
      chips: [{ text: s.part, art: s.art, goes: "gap" }] };
    for (k = 0; k < others.length; k++) { scr.chips.push({ text: others[k].part, art: others[k].art }); }
    return scr;
  }
  /* one activity: which sense does it use? */
  function actScreen(a) {
    var s = BY[a.sense], others = otherSenses(a.sense, 2), k;
    var scr = { text: "Which sense do we use?", say: ["Which sense do we use to", a.act],
      targets: [{ id: "act", art: a.art, cap: a.act, done: [capital(a.act) + "!", s.book] }],
      chips: [senseChip(s, "act", true)] };
    for (k = 0; k < others.length; k++) { scr.chips.push(senseChip(others[k], null, true)); }
    return scr;
  }
  /* several activities at once, each with a different sense */
  function actsScreen(list) {
    var scr = { text: "Match each sense to what we do.", say: "Can you match each sense to what we do?", targets: [], chips: [] }, k;
    for (k = 0; k < list.length; k++) {
      scr.targets.push({ id: list[k].sense, art: list[k].art, cap: list[k].act, done: [capital(list[k].act) + "!", BY[list[k].sense].book] });
      scr.chips.push(senseChip(BY[list[k].sense], list[k].sense, true));
    }
    return scr;
  }
  function capital(t) { return t.charAt(0).toUpperCase() + t.slice(1); }
  function distinctActs(n) {
    var all = Shell.shuffle(BOOK_ACTS.concat(NEW_ACTS)), used = {}, out = [], k;
    for (k = 0; k < all.length && out.length < n; k++) { if (!used[all[k].sense]) { used[all[k].sense] = 1; out.push(all[k]); } }
    return out;
  }

  var CONTENT = {
    levels: [
      { name: "Warm Up", art: "eyes",
        make: function () {
          var s = Shell.shuffle(SENSES);
          return [{ banner: "Level 1", bannerSay: "Level one! Let's warm up!",
            items: [pairsScreen([s[0], s[1]]), pairsScreen([s[2], s[3]]), pairsScreen([s[4], s[0]])] }];
        } },
      { name: "Our Senses", art: "ears", ribbon: "Book",
        make: function () {
          var out = [], k;
          for (k = 0; k < SENSES.length; k++) { out.push(sentenceScreen(SENSES[k])); }
          return [{ banner: "Level 2", bannerSay: "Level two! Our senses, from your book!", items: out }];
        } },
      { name: "Which Sense?", art: "flower", ribbon: "Book",
        make: function () {
          var acts = BOOK_ACTS.concat(Shell.shuffle(NEW_ACTS).slice(0, 2)), out = [], k;
          for (k = 0; k < acts.length; k++) { out.push(actScreen(acts[k])); }
          return [{ banner: "Level 3", bannerSay: "Level three! Which sense do we use?", items: out }];
        } },
      { name: "Match Three", art: "nose",
        make: function () {
          var s = Shell.shuffle(SENSES);
          return [{ banner: "Level 4", bannerSay: "Level four! Match three!", items: [pairsScreen(s.slice(0, 3)), pairsScreen([s[3], s[4], s[0]])] }];
        } },
      { name: "Mix It Up", art: "icecream",
        make: function () {
          return [{ banner: "Level 5", bannerSay: "Level five! Mix it up!", items: [actsScreen(distinctActs(3)), actsScreen(distinctActs(3))] }];
        } },
      { name: "Super Senses", art: "trophy",
        make: function () {
          return [{ banner: "Level 6", bannerSay: "Level six! All five senses!", shuffle: false,
            items: [pairsScreen(SENSES.slice()), actsScreen(distinctActs(3))] }];
        } }
    ]
  };

  Match.init(CONTENT);
  Shell.boot({
    asset: "ENG01CH02SENSEMATCH",
    version: "v-03",
    title: "Sense and Body Part",
    intro: "Match each sense to its body part.",
    theme: "garden",
    buddy: "kid",
    heroArt: "flower",
    levels: CONTENT.levels,
    start: Match.start,
    resume: Match.resume,
    score: function () { return Match.score || 0; },
    max: Match.max
  });
})();
