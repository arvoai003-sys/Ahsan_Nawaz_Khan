<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="asset" content="ENG01CH02SENSESREAD v-01">
<title>Read-along Our Senses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ARVO Grade 1 shell: bright nursery theme shared by every APSIS G1 asset. */
:root {
  --ink: #2E2A4F;
  --ink-soft: #5B5680;
  --sky-top: #6CCBFF;
  --sky-bottom: #CFF0FF;
  --yellow: #FFD23F; --yellow-d: #E0A800;
  --red: #FF4F6D;    --red-d: #D6204A;
  --blue: #2EA7FF;   --blue-d: #0B7FD6;
  --green: #23C16B;  --green-d: #139650;
  --orange: #FF9F1C; --orange-d: #E07B00;
  --purple: #9B5DE5; --purple-d: #7A3CC8;
  --pink: #FF7BAC;
  --right: #23C16B;
  --card: #FFFFFF;
  --radius: 26px;
  --font-title: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-read: "Andika", "Century Gothic", "Segoe UI", system-ui, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--sky-bottom);
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 70%);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; }

/* scenery: clouds and hills, behind everything */
#scenery { position: fixed; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; z-index: 0; }
#scenery svg { position: absolute; }
#scenery .ground { left: 0; bottom: 0; width: 100%; height: 22%; min-height: 90px; }
#scenery .cloud { width: 150px; height: 70px; opacity: .95; animation: drift 40s linear infinite; }
#scenery .c1 { top: 12%; left: -10%; }
#scenery .c2 { top: 30%; left: 70%; width: 110px; animation-duration: 55s; animation-delay: -20s; }
#scenery .c3 { top: 6%; left: 40%; width: 90px; animation-duration: 65s; animation-delay: -35s; }
@keyframes drift { 0% { transform: translateX(-20vw); } 100% { transform: translateX(120vw); } }

#app { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; z-index: 1; }

/* ---------- screens ---------- */
.screen { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: none; flex-direction: column; }
.screen.on { display: flex; }

/* ---------- chunky candy buttons ---------- */
.big-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-width: 150px; min-height: 72px; padding: 0 26px; border: 4px solid var(--ink); border-radius: 40px;
  background: var(--yellow); color: var(--ink); font-family: var(--font-title);
  font-weight: 800; font-size: 26px; cursor: pointer; white-space: nowrap;
  box-shadow: 0 7px 0 var(--ink); transition: transform .08s, box-shadow .08s;
}
.big-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
.big-btn.green { background: var(--green); color: #fff; }
.big-btn.blue { background: var(--blue); color: #fff; }
.big-btn.pink { background: var(--pink); color: #fff; }
.big-btn .ic { width: 30px; height: 30px; display: inline-block; }
.big-btn .ic svg { width: 100%; height: 100%; }
.btn-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }

.icon-btn {
  width: 62px; height: 62px; border-radius: 50%; border: 4px solid var(--ink); background: var(--card);
  box-shadow: 0 5px 0 var(--ink); display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex: 0 0 auto; padding: 0;
}
.icon-btn svg { width: 30px; height: 30px; }
.icon-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.icon-btn.talk { background: var(--blue); color: #fff; }
.icon-btn.talk svg { fill: #fff; }
.icon-btn.home { background: var(--green); }
.icon-btn.home svg { width: 36px; height: 36px; }
.icon-btn.pause { background: var(--yellow); }
.icon-btn.music { background: var(--pink); }
.icon-btn.music svg { width: 30px; height: 30px; }
.icon-btn.music.off { background: #C9C4DA; }
.icon-btn.music.off::after { content: ""; position: absolute; width: 40px; height: 5px; background: var(--ink); border-radius: 3px; transform: rotate(-45deg); }
.icon-btn { position: relative; }

/* ---------- home: level picker ---------- */
.home-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 14px 16px 18px; min-height: 0; overflow-y: auto; }
.home-head { display: flex; align-items: center; gap: 12px; margin: 4px 0 12px; }
.home-head .mascot { width: 96px; height: 96px; flex: 0 0 auto; animation: bob 2.4s ease-in-out infinite; }
.home-head .mascot svg { width: 100%; height: 100%; }
.home-title .kicker {
  font-weight: 800; letter-spacing: .08em; font-size: 14px; color: #fff;
  background: var(--purple); border-radius: 20px; padding: 2px 12px; display: inline-block;
  border: 3px solid var(--ink);
}
.home-title h1 {
  font-family: var(--font-title); font-weight: 800; font-size: 40px; line-height: 1; margin: 6px 0 0;
  color: #fff; -webkit-text-stroke: 2px var(--ink); text-shadow: 0 4px 0 var(--ink);
}
.home-head .icon-btn { margin-left: 4px; }
.choose { font-family: var(--font-title); font-weight: 800; font-size: 24px; color: var(--ink); margin: 0; }
.choose-row { display: flex; align-items: center; gap: 14px; margin: 0 0 16px; }
.choose-row .icon-btn { width: 54px; height: 54px; }

.levels { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; max-width: 760px; }
.level {
  position: relative; width: 210px; min-height: 170px; border-radius: 28px; border: 4px solid var(--ink);
  background: var(--yellow); box-shadow: 0 8px 0 var(--ink); cursor: pointer; padding: 12px 10px 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  transition: transform .1s, box-shadow .1s; outline: none;
}
.level:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--ink); }
.level:focus-visible { outline: 5px solid #fff; }
.level .num {
  position: absolute; top: -14px; left: -10px; width: 46px; height: 46px; border-radius: 50%;
  background: #fff; border: 4px solid var(--ink); font-family: var(--font-title); font-weight: 800;
  font-size: 26px; line-height: 38px; text-align: center;
}
.level .art { width: 80px; height: 80px; background: #fff; border-radius: 50%; border: 4px solid var(--ink); padding: 8px; }
.level .art svg { width: 100%; height: 100%; }
.level .name { font-family: var(--font-title); font-weight: 800; font-size: 24px; color: #fff; -webkit-text-stroke: 1px var(--ink); text-shadow: 0 3px 0 var(--ink); line-height: 1.1; text-align: center; margin-top: 4px; }
.level .lstars { display: flex; gap: 2px; margin-top: 4px; }
.level .lstars svg { width: 26px; height: 26px; }
.level .ribbon {
  position: absolute; top: -12px; right: -8px; background: #fff; border: 3px solid var(--ink); border-radius: 12px;
  font-weight: 800; font-size: 14px; padding: 0 8px; transform: rotate(6deg);
}
.level.c0 { background: var(--yellow); } .level.c1 { background: var(--red); } .level.c2 { background: var(--blue); }
.level.c3 { background: var(--green); } .level.c4 { background: var(--orange); } .level.c5 { background: var(--purple); }

/* ---------- panels (end, pause) ---------- */
.panel-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; }
.panel {
  background: var(--card); border-radius: 34px; border: 5px solid var(--ink); box-shadow: 0 10px 0 var(--ink);
  padding: 22px 22px 26px; width: 92vw; max-width: 500px; text-align: center; position: relative;
}
.panel h1 {
  font-family: var(--font-title); font-weight: 800; font-size: 46px; line-height: 1; margin: 4px 0 6px;
  color: var(--orange); -webkit-text-stroke: 2px var(--ink); text-shadow: 0 4px 0 var(--ink);
}
.panel .mascot { width: 110px; height: 110px; margin: -70px auto 0; display: block; animation: bob 2.4s ease-in-out infinite; }
.panel .mascot svg { width: 100%; height: 100%; }
.panel .sub { font-size: 20px; font-weight: 700; color: var(--ink-soft); margin: 2px 0 8px; }

/* ---------- top bar ---------- */
.topbar { flex: 0 0 auto; height: 80px; display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
.progress { flex: 1; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.progress i {
  width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid var(--ink);
  display: block; opacity: .75;
}
.progress i.done { background: var(--green); opacity: 1; }
.progress i.now { background: var(--yellow); opacity: 1; transform: scale(1.25); }
.star-count {
  display: flex; align-items: center; gap: 4px; font-family: var(--font-title);
  font-weight: 800; font-size: 26px; background: var(--card); border-radius: 30px; border: 4px solid var(--ink);
  padding: 2px 14px 2px 6px; box-shadow: 0 5px 0 var(--ink);
}
.star-count svg { width: 32px; height: 32px; }
.level-tag {
  font-family: var(--font-title); font-weight: 800; font-size: 18px; color: #fff; background: var(--purple);
  border: 3px solid var(--ink); border-radius: 18px; padding: 2px 10px; white-space: nowrap;
}

/* ---------- stage ---------- */
.stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 4px 16px 24px; gap: 18px; min-height: 0; }
.prompt {
  display: flex; align-items: center; gap: 12px; background: var(--card);
  border-radius: 30px; border: 4px solid var(--ink); padding: 8px 18px 8px 8px; box-shadow: 0 6px 0 var(--ink);
  max-width: 660px;
}
.prompt .say { width: 58px; height: 58px; flex: 0 0 auto; }
.prompt-text { font-family: var(--font-read); font-weight: 700; font-size: 26px; font-size: clamp(20px, 5vw, 26px); line-height: 1.25; }
.prompt-text b { color: var(--red); }
.counter { display: flex; gap: 6px; margin-left: 4px; }
.counter b { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--ink); background: #fff; display: block; }
.counter b.got { background: var(--green); }

/* round banner */
.banner {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: none; align-items: center; justify-content: center;
  z-index: 30;
}
.banner.on { display: flex; }
.banner div {
  font-family: var(--font-title); font-weight: 800; font-size: 56px; font-size: clamp(36px, 10vw, 60px);
  color: #fff; -webkit-text-stroke: 2px var(--ink); text-shadow: 0 5px 0 var(--ink);
  background: var(--pink); border: 5px solid var(--ink); border-radius: 34px; padding: 10px 34px;
  box-shadow: 0 10px 0 var(--ink); animation: pop .5s cubic-bezier(.2,1.6,.4,1); text-align: center;
}

/* ---------- pause overlay ---------- */
.overlay {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(46,42,79,.5); display: none;
  align-items: center; justify-content: center; z-index: 50; padding: 16px;
}
.overlay.on { display: flex; }
.menu { display: flex; flex-direction: column; gap: 16px; margin-top: 10px; }
.menu .big-btn { width: 100%; }

/* ---------- feedback ---------- */
.shake { animation: shake .45s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-12px) rotate(-3deg)} 40%{transform:translateX(10px) rotate(2deg)} 60%{transform:translateX(-7px)} 80%{transform:translateX(5px)} }
@keyframes pop { 0%{transform:scale(.3);opacity:0} 100%{transform:scale(1);opacity:1} }
@keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
@keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-6deg)} 75%{transform:rotate(6deg)} }

.praise {
  position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%);
  font-family: var(--font-title); font-weight: 800; font-size: 72px; font-size: clamp(44px, 13vw, 80px);
  color: var(--yellow); -webkit-text-stroke: 3px var(--ink); text-shadow: 0 6px 0 var(--ink);
  pointer-events: none; z-index: 40; display: none; white-space: nowrap;
}
.praise.on { display: block; animation: pop .45s cubic-bezier(.2,1.6,.4,1); }

#confetti { position: fixed; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; z-index: 45; }

/* tutorial hand */
.hand {
  position: fixed; width: 76px; height: 76px; z-index: 60; pointer-events: none;
  display: none; transition: left .9s ease-in-out, top .9s ease-in-out;
  filter: drop-shadow(0 4px 4px rgba(0,0,0,.25));
}
.hand.on { display: block; }
.hand.tap { animation: tap .5s ease-in-out 2; }
@keyframes tap { 0%,100%{transform:scale(1)} 50%{transform:scale(.82)} }

/* end stars */
.end-stars { display: flex; justify-content: center; gap: 6px; margin: 6px 0 8px; }
.end-stars svg { width: 76px; height: 76px; }
.end-stars svg.lit { animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }
.end-stars svg:nth-child(2) { animation-delay: .25s; margin-top: -16px; }
.end-stars svg:nth-child(3) { animation-delay: .5s; }

@media (max-width: 520px) {
  .home-wrap { padding-top: 8px; }
  .home-head { margin: 0 0 6px; }
  .home-head .mascot { width: 64px; height: 64px; }
  .home-title h1 { font-size: 28px; }
  .home-title .kicker { font-size: 12px; }
  .choose { font-size: 20px; }
  .choose-row { margin-bottom: 14px; gap: 10px; }
  .choose-row .icon-btn { width: 48px; height: 48px; }
  .levels { gap: 14px 12px; }
  .level { width: 46%; min-height: 112px; padding: 6px 6px 5px; border-radius: 24px; }
  .level .art { width: 48px; height: 48px; padding: 4px; }
  .level .name { line-height: 1.05; }
  .choose-row { margin-bottom: 12px; }
  .level .name { font-size: 19px; }
  .level .lstars svg { width: 20px; height: 20px; }
  .topbar { gap: 8px; padding: 8px; }
  .icon-btn { width: 54px; height: 54px; }
  .level-tag { display: none; }
  .progress { gap: 4px; }
  .progress i { width: 13px; height: 13px; border-width: 2.5px; }
  .star-count { font-size: 22px; padding: 2px 10px 2px 4px; }
  .star-count svg { width: 26px; height: 26px; }
  .panel h1 { font-size: 38px; }
}
@media (max-height: 520px) {
  .topbar { height: 66px; }
  .icon-btn { width: 52px; height: 52px; }
  .stage { gap: 10px; padding-bottom: 10px; }
  .home-wrap { padding-top: 6px; }
  .home-head { margin: 0 0 6px; }
  .home-head .mascot { width: 60px; height: 60px; }
  .home-title h1 { font-size: 30px; }
  .choose { display: none; }
  .choose-row { position: absolute; top: 8px; right: 10px; margin: 0; }
  .choose-row .icon-btn { width: 48px; height: 48px; }
  .levels { max-width: none; flex-wrap: nowrap; gap: 10px; }
  .level { width: 112px; min-height: 150px; padding: 10px 4px 6px; }
  .level .art { width: 58px; height: 58px; padding: 5px; }
  .level .name { font-size: 17px; }
  .level .lstars svg { width: 18px; height: 18px; }
  .panel { padding: 12px 16px 16px; }
  .panel .mascot { width: 70px; height: 70px; margin-top: -44px; }
  .panel h1 { font-size: 34px; }
  .end-stars svg { width: 50px; height: 50px; }
  .end-stars { margin: 2px 0 4px; }
  .panel .sub { margin: 0 0 2px; font-size: 17px; }
  .btn-row { flex-wrap: nowrap; gap: 10px; margin-top: 4px; }
  .btn-row .big-btn { min-width: 0; min-height: 60px; padding: 0 16px; font-size: 21px; }
  .menu { gap: 10px; }
  .menu .big-btn { min-height: 54px; font-size: 21px; }
  #scenery .ground { height: 16%; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ================= themes (one look per game) ================= */
body.theme-meadow { background: linear-gradient(180deg, #6CCBFF 0%, #CFF0FF 70%); }
body.theme-sunset { background: linear-gradient(180deg, #FF8A5B 0%, #FFB36B 40%, #FFE0B2 78%); }
body.theme-garden { background: linear-gradient(180deg, #C9B6FF 0%, #E6DCFF 45%, #E8FFF0 80%); }
body.theme-school { background: linear-gradient(180deg, #3FD0C9 0%, #A8F0E8 55%, #E6FFFB 80%); }
body.theme-balloons { background: linear-gradient(180deg, #8FD8FF 0%, #D6F1FF 55%, #F2FBFF 80%); --t-title: #FF4F6D; }
#scenery .balloon { position: absolute; width: 44px; height: 78px; bottom: -90px; animation: floatup 26s linear infinite; opacity: .9; }
#scenery .bl0 { left: 6%; } #scenery .bl1 { left: 22%; animation-delay: -5s; } #scenery .bl2 { left: 40%; animation-delay: -11s; }
#scenery .bl3 { left: 60%; animation-delay: -16s; } #scenery .bl4 { left: 78%; animation-delay: -20s; } #scenery .bl5 { left: 92%; animation-delay: -8s; }
@keyframes floatup { from { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-60vh) rotate(4deg); } to { transform: translateY(-125vh) rotate(-4deg); } }
body.theme-balloons .level { border-radius: 50px 50px 24px 24px; }
body.theme-balloons .level.c0 { background: #FF4F6D; } body.theme-balloons .level.c1 { background: #2EA7FF; } body.theme-balloons .level.c2 { background: #23C16B; }
body.theme-balloons .banner div { background: #FF4F6D; } body.theme-balloons .progress i.now { background: #FF4F6D; }
body.theme-classroom { background: linear-gradient(180deg, #FFF3B0 0%, #FFE9A0 60%, #FFF6D6 80%); --t-title: #FF4F6D; }
#scenery .board { position: absolute; right: 4%; top: 16%; width: 260px; opacity: .35; }
body.theme-classroom .level { border-radius: 10px; border-width: 5px; }
body.theme-classroom .level.c0 { background: #FF4F6D; } body.theme-classroom .level.c1 { background: #2EA7FF; } body.theme-classroom .level.c2 { background: #23C16B; }
body.theme-classroom .level.c3 { background: #FF9F1C; } body.theme-classroom .level.c4 { background: #9B5DE5; } body.theme-classroom .level.c5 { background: #2F6B4F; }
body.theme-classroom .banner div { background: #FF4F6D; } body.theme-classroom .progress i.now { background: #FF4F6D; }
body.theme-library { background: linear-gradient(180deg, #FFE3C8 0%, #FFF1DE 55%, #FFF8EE 80%); --t-title: #9B5DE5; }
body.theme-library .level { border-radius: 14px 30px 30px 14px; border-left-width: 12px; }
body.theme-library .level.c0 { background: #9B5DE5; } body.theme-library .level.c1 { background: #FF9F1C; } body.theme-library .level.c2 { background: #23C16B; }
body.theme-library .banner div { background: #9B5DE5; } body.theme-library .progress i.now { background: #9B5DE5; }
body.theme-rainbow { background: linear-gradient(180deg, #FFE9A8 0%, #FFD6E8 50%, #FFF3F8 80%); --t-title: #2EA7FF; }
#scenery .rainbow { position: absolute; left: 50%; bottom: 14%; width: 70%; max-width: 760px; transform: translateX(-50%); opacity: .55; }
body.theme-rainbow .level { border-radius: 36px; }
body.theme-rainbow .level.c0 { background: #2EA7FF; } body.theme-rainbow .level.c1 { background: #FF4F6D; } body.theme-rainbow .level.c2 { background: #23C16B; }
body.theme-rainbow .level.c3 { background: #9B5DE5; } body.theme-rainbow .level.c4 { background: #FF9F1C; } body.theme-rainbow .level.c5 { background: #FF7BAC; }
body.theme-rainbow .banner div { background: #2EA7FF; } body.theme-rainbow .progress i.now { background: #2EA7FF; }
#scenery .sun { position: absolute; width: 150px; height: 150px; left: 8%; top: 8%; }
#scenery .bfly { position: absolute; width: 44px; height: 34px; animation: flutter 7s ease-in-out infinite; }
#scenery .b1 { left: 10%; top: 30%; } #scenery .b2 { right: 12%; top: 22%; animation-delay: -3s; }
@keyframes flutter { 0%,100% { transform: translate(0,0) scaleX(1); } 25% { transform: translate(30px,-20px) scaleX(.7); } 50% { transform: translate(60px,0) scaleX(1); } 75% { transform: translate(30px,20px) scaleX(.7); } }

/* ================= home: big, bold title ================= */
.home-head { flex-direction: column; gap: 4px; margin: 2px 0 8px; }
.home-title { display: flex; align-items: center; gap: 12px; justify-content: center; }
.home-title .hero-art { width: 84px; height: 84px; flex: 0 0 auto; background: #fff; border: 5px solid var(--ink); border-radius: 50%; padding: 8px; box-shadow: 0 6px 0 var(--ink); animation: bob 2.6s ease-in-out infinite; }
.home-title .hero-art:empty { display: none; }
.home-title .hero-art svg { width: 100%; height: 100%; }
.home-title h1 {
  font-family: var(--font-title); font-weight: 800; line-height: .95; margin: 0; text-align: left;
  font-size: 64px; font-size: clamp(40px, 8.5vw, 76px);
  color: var(--t-title, #fff); -webkit-text-stroke: 3px var(--ink); text-shadow: 0 6px 0 var(--ink), 0 10px 18px rgba(46,42,79,.25);
  letter-spacing: .01em;
}
body.theme-meadow { --t-title: #FFD23F; }
body.theme-sunset { --t-title: #FFFFFF; }
body.theme-garden { --t-title: #FF7BAC; }
body.theme-school { --t-title: #FF9F1C; }
.home-head .mascot { display: none; }
body.has-buddy .home-head .mascot { display: block; position: fixed; left: 8px; bottom: 6px; width: 96px; height: 160px; z-index: 2; animation: none; }

/* level tiles take the theme's colours and shape */

body.theme-sunset .level.c0 { background: #FF4F6D; } body.theme-sunset .level.c1 { background: #2EA7FF; } body.theme-sunset .level.c2 { background: #9B5DE5; }
body.theme-sunset .level.c3 { background: #23C16B; } body.theme-sunset .level.c4 { background: #FF9F1C; } body.theme-sunset .level.c5 { background: #5B5680; }
body.theme-garden .level { border-radius: 60px 60px 26px 26px; }
body.theme-garden .level.c0 { background: #FF7BAC; } body.theme-garden .level.c1 { background: #9B5DE5; } body.theme-garden .level.c2 { background: #23C16B; }
body.theme-garden .level.c3 { background: #FF9F1C; } body.theme-garden .level.c4 { background: #2EA7FF; } body.theme-garden .level.c5 { background: #FF4F6D; }

/* ================= buddy (an unnamed child) ================= */
.buddy { width: 100%; height: 100%; }
.buddy svg { width: 100%; height: 100%; overflow: visible; }
.buddy .b-all { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe-b 3s ease-in-out infinite; }
.buddy .b-eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4.2s infinite; }
.buddy .b-arm { transform-box: fill-box; transition: transform .25s; }
.buddy .b-arm-l { transform-origin: 90% 0%; } .buddy .b-arm-r { transform-origin: 10% 0%; }
.buddy .b-head { transform-box: fill-box; transform-origin: 50% 90%; transition: transform .3s; }
.buddy .b-talk { display: none; }
.buddy.talk .b-smile { display: none; }
.buddy.talk .b-talk { display: block; transform-box: fill-box; transform-origin: 50% 20%; animation: yap .22s ease-in-out infinite alternate; }
.buddy.wave .b-arm-r { animation: wave .5s ease-in-out 4 alternate; }
.buddy.cheer .b-all { animation: hop .5s ease-in-out 2; }
.buddy.cheer .b-arm-l { transform: rotate(150deg); } .buddy.cheer .b-arm-r { transform: rotate(-150deg); }
.buddy.think .b-head { transform: rotate(-9deg); }
.buddy.think .b-arm-r { transform: rotate(-40deg); }
@keyframes breathe-b { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.015,.985); } }
@keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes yap { from { transform: scaleY(.35); } to { transform: scaleY(1); } }
@keyframes wave { from { transform: rotate(-150deg); } to { transform: rotate(-110deg); } }
@keyframes hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14%); } }

.game-buddy { position: fixed; left: 6px; bottom: 4px; width: 76px; height: 118px; pointer-events: none; z-index: 2; display: none; }
body.has-buddy .game-buddy { display: block; transition: opacity .25s, transform .25s; }
body.has-buddy .game-buddy.away { opacity: 0; transform: translateX(-110%); }
.game-buddy .buddy { position: absolute; left: 0; bottom: 0; width: 70px; height: 118px; }

body.has-buddy .panel .mascot { width: 92px; height: 150px; margin: -118px auto 0; animation: none; }

/* Read-along: a picture book page with tappable words */
.ra-book {
  background: #FFFDF6; border: 5px solid var(--ink); border-radius: 30px; box-shadow: 0 10px 0 var(--ink);
  width: 92vw; max-width: 760px; padding: 18px 20px 20px; display: flex; flex-direction: column; align-items: center; gap: 14px;
  animation: pop .45s cubic-bezier(.2,1.6,.4,1) both;
}
.ra-pic {
  display: flex; justify-content: center; align-items: flex-end; gap: 10px; width: 100%; min-height: 150px;
  background: linear-gradient(180deg, #E4F6FF, #F4FFF0); border: 4px solid var(--ink); border-radius: 22px; padding: 10px; cursor: pointer;
}
.ra-pic.cover { background: linear-gradient(180deg, #FFE9A8, #FFD6E8); }
.ra-art { width: 150px; height: 150px; animation: bob 3s ease-in-out infinite; }
.ra-art:nth-child(2) { animation-delay: -1s; } .ra-art:nth-child(3) { animation-delay: -2s; }
.ra-art svg { width: 100%; height: 100%; }
.ra-text { font-family: var(--font-read); font-size: 44px; line-height: 1.35; text-align: center; color: var(--ink); }
.ra-text.cover { font-family: var(--font-title); font-size: 72px; font-weight: 800; color: #FF9F1C; -webkit-text-stroke: 2px var(--ink); }
.ra-text .w { border-radius: 12px; padding: 0 4px; cursor: pointer; transition: background .12s, color .12s, transform .12s; display: inline-block; }
.ra-text .w.bold { font-weight: 700; }
.ra-text .w.on { background: var(--yellow); box-shadow: 0 4px 0 #E0A800; transform: translateY(-3px); }
.ra-text .w.tap { animation: wordpop .4s; }
.ra-text .w.found { background: var(--green); color: #fff; }
@keyframes wordpop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
.ra-words { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.ra-heading {
  font-family: var(--font-title); font-weight: 800; font-size: 34px; color: #fff; background: var(--pink);
  border: 4px solid var(--ink); border-radius: 20px; padding: 0 22px; box-shadow: 0 5px 0 var(--ink); cursor: pointer;
  -webkit-text-stroke: 1px var(--ink); margin-bottom: -4px;
}
.ra-gloss {
  font-family: var(--font-read); font-size: 22px; background: #F3EBFF; border: 3px dashed var(--purple); border-radius: 16px;
  padding: 8px 14px; cursor: pointer; max-width: 560px; text-align: center;
}
.ra-gloss b { color: var(--purple-d); font-size: 26px; margin-right: 6px; }
.ra-nav { display: flex; gap: 24px; justify-content: center; }
.ra-nav .icon-btn { width: 72px; height: 72px; font-size: 30px; font-weight: 800; background: var(--green); color: #fff; }
.ra-nav .ra-back { background: #fff; color: var(--ink); }
.ra-nav .icon-btn.pulse { animation: bob 1s ease-in-out infinite; box-shadow: 0 5px 0 var(--ink), 0 0 0 8px #FFF1B8; }

@media (max-width: 520px) {
  .ra-heading { font-size: 26px; }
  .ra-book { padding: 12px; gap: 10px; }
  .ra-pic { min-height: 110px; gap: 4px; }
  .ra-art { width: 96px; height: 96px; }
  .ra-text { font-size: 32px; }
  .ra-text.cover { font-size: 54px; }
  .ra-heading {

}

@media (max-height: 520px) {

  .ra-art { width: 78px; height: 78px; }
  .ra-text { font-size: 28px; }

  .ra-heading {
  font-family: var(--font-title); font-weight: 800; font-size: 34px; color: #fff; background: var(--pink);
  border: 4px solid var(--ink); border-radius: 20px; padding: 0 22px; box-shadow: 0 5px 0 var(--ink); cursor: pointer;
  -webkit-text-stroke: 1px var(--ink); margin-bottom: -4px;
}

  .ra-nav { flex-direction: column; gap: 12px; }

  .ra-art { width: 190px; height: 190px; }
  .ra-text { font-size: 54px; }
}

<div id="scenery" aria-hidden="true"></div>

<div id="app">

      <div class="home-head">

      </div>
      <div class="levels" id="levels"></div>

  <section class="screen" id="game">

    <div class="banner" id="banner"></div>
    <div class="game-buddy" id="game-buddy"></div>

  <section class="screen" id="end">

      <div class="panel">

    </div>
  </section>

</div>

<div class="overlay" id="pause">
  <div class="panel">
    <h1>Paused</h1>
    <div class="menu">
      <button class="big-btn green" id="resume-btn" type="button">&#9654; Resume</button>
      <button class="big-btn blue" id="sound-btn" type="button">Sound: on</button>

      <button class="big-btn pink" id="restart-btn" type="button">&#8635; Restart</button>
      <button class="big-btn" id="menu-home-btn" type="button">Home</button>
    </div>
  </div>
</div>

/* Read-along engine. A short book, page by page: a picture and the book's
   sentence. Recognition only (no score). Three modes, chosen on the home page:
     listen  "Read to Me": the narrator reads each page; words light up in turn
     self    "Read by Myself": nothing is read automatically; tap any word to hear it
     hunt    "Word Hunt": on each page, find one word ("Can you find the word go?")
   Any word can be tapped to hear it; tapping the picture reads the page again.
   Content: { pages: [ { art: [keys], text, bold: [words], glossary } ],
              glossary: { word, meaning, art }, levels: [ { name, art, mode } ] }

  function stopLight() {
    if (timer) { window.clearInterval(timer); timer = null; }

    for (i = 0; i < spans.length; i++) { w.push(weight(spans[i].textContent)); total += w[i]; }
    var t0 = new Date().getTime();

      var dur = player && player.duration && isFinite(player.duration) ? player.duration - 0.2 : est;
      var now = player && player.duration ? player.currentTime : (new Date().getTime() - t0) / 1000;
      var at = Math.min(1, now / Math.max(0.3, dur)) * total, acc = 0, k = 0;
      for (k = 0; k < spans.length; k++) { acc += w[k]; if (at < acc) { break; } }

        if (on && spans[i].className.indexOf(" on") < 0) { spans[i].className += " on"; lit.push(spans[i]); }
        if (!on) { spans[i].className = spans[i].className.replace(" on", ""); }

    var p = pages[idx], spans = Shell.$("stage").querySelectorAll(".ra-text .w");

    var pic = Shell.el("div", "ra-pic" + (p.cover ? " cover" : ""));

      } else if (idx === 0) {

      } else {
